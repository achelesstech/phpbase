# =============================================================================
# Portainer CE — single host, behind Traefik
# =============================================================================
#   make init            secrets, encryption key, admin password
#   make up
#   make doctor
#
# Replaces the official guide's `docker run -p 9443:9443 …`. The published port
# is the thing that goes: it is a second, unguarded front door to a service
# that is root on this host. Traefik is the only way in.
#
# Behaviours below were verified against portainer-ce 2.39.5 (lts); see
# AUDIT.md for what each test showed.
# =============================================================================

networks:
  # Created once, outside compose:  docker network create proxy
  proxy:
    external: true

volumes:
  # Holds users, the JWT signing secret, environment definitions and any
  # registry credentials. This IS your Portainer install — the container is
  # disposable, this is not. `make backup` covers it.
  #
  # If you are moving an existing `docker run` install, its volume is already
  # called portainer_data. Add `external: true` here to adopt it rather than
  # letting compose create a project-prefixed new one and dropping you back at
  # first-run setup.
  portainer_data:
    name: portainer_data

secrets:
  # Encrypts the data store at rest. Portainer looks for it at
  # /run/secrets/<--secret-key-name>, which defaults to "portainer", so the
  # secret must be named exactly this.
  #
  # LOSE THIS FILE AND THE INSTALL IS GONE. Verified: booting an encrypted
  # store without the key is
  #   fatal: The portainer database is encrypted, but no secret was loaded
  # and the container will not start. There is no recovery path. `make backup`
  # tars it together with the volume; keep that tarball somewhere else.
  portainer:
    file: ./secrets/encryption_key

  # Plaintext admin password, used ONCE to create the admin user.
  #
  # It must keep existing afterwards. Verified: on a later boot with the flag
  # set and the file deleted, Portainer exits with
  #   fatal: could not get the contents of the file
  # With the file present and an admin already created it logs
  #   "administrator user defined, skipping admin password related flags"
  # and carries on, so leaving it in place is safe and rotating in the UI does
  # not invalidate it.
  portainer_admin_password:
    file: ./secrets/admin_password

services:
  portainer:
    # Pin the minor; :lts and :latest both move under you. Renovate keeps the
    # digest current.
    image: portainer/portainer-ce:2.39.5
    container_name: portainer
    restart: unless-stopped

    security_opt: [no-new-privileges:true]

    # No read_only: Portainer writes its BoltDB, TLS material and temp files
    # under /data, and unpacks assets at runtime.
    #
    # No cap_drop: ALL either. Unlike Traefik, this container's job is to drive
    # the Docker API — the privilege that matters is the socket below, and no
    # capability tuning offsets it. See "Why this cannot be hardened like
    # Traefik" in README.md.

    networks: [proxy]

    # NO PORTS. This is the whole point of the rewrite.
    #
    # The official guide publishes 9443 (Portainer's own HTTPS, self-signed)
    # and 8000 (the Edge agent tunnel). Both bypass Traefik entirely — no IP
    # allowlist, no rate limit, no HSTS, no real certificate — and Docker's
    # iptables rules mean `ufw status` will not show them as open.
    #
    # 8000 is only needed if you manage remote hosts with Edge agents. Single
    # host: it stays closed. Portainer still binds it inside the container;
    # unpublished, that is inert.

    volumes:
      - portainer_data:/data
      # Read-write, and it has to be.
      #
      # Creating, starting and exec-ing into containers is what Portainer is
      # for, and all of it is POST on the Docker API. The socket proxy that
      # fronts Traefik refuses POST — put it here and you get a read-only
      # dashboard. So this is full Docker API access, i.e. root on the host,
      # held by a web UI. Everything else in this file exists because of that
      # sentence.
      - /var/run/docker.sock:/var/run/docker.sock

    secrets:
      - portainer
      - portainer_admin_password

    command:
      # Serve plain HTTP on :9000. TLS is Traefik's job; terminating it twice
      # means a self-signed cert Traefik has to be told to ignore.
      # Portainer still serves HTTPS on :9443 internally — unpublished, unused.
      - --http-enabled

      - --admin-password-file=/run/secrets/portainer_admin_password

      # CSRF protection. Portainer rejects requests whose Origin is not listed,
      # and behind a reverse proxy on a custom hostname that is every request:
      # the UI loads, then login fails and the API 403s.
      #
      # BARE HOSTNAME ONLY. Verified: "https://portainer.example.com",
      # ".../" and "...:443" are all
      #   fatal: invalid url for trusted origin
      # and the container will not start.
      - --trusted-origins=${PORTAINER_DOMAIN:?set PORTAINER_DOMAIN in .env}

      # Portainer's own CSP: object-src 'none', frame-ancestors 'none'.
      # Independent of Traefik's security-headers middleware; no conflict.
      - --csp

      # Parseable logs, matching the Traefik stack.
      - --log-mode=JSON
      - --log-level=INFO

    # No healthcheck, deliberately.
    #
    # The image has no shell and no wget or curl — `docker exec portainer sh`
    # is "executable file not found". A HEALTHCHECK copied from a blog post
    # cannot run, so the container reports unhealthy forever, and with an
    # orchestrator that acts on health that is a restart loop. Traefik's
    # service-level check does the equivalent from outside if you want one:
    #   traefik.http.services.portainer.loadbalancer.healthcheck.path=/
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.portainer.loadbalancer.server.port=9000

      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=cloudflare
      - traefik.http.routers.portainer.tls.options=modern@file

      # IP allowlist + basic auth + strict rate limit, in front of Portainer's
      # own login. Two independent credentials on the door to root.
      #
      # EDIT ipallowlist-admin.sourceRange in the Traefik config before this is
      # useful — as shipped it allows private ranges only, i.e. VPN or an SSH
      # tunnel. That is the safe default, not an oversight.
      - traefik.http.routers.portainer.middlewares=chain-admin-restricted@file,noindex@file

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
