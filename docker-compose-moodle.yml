# =============================================================================
# Moodle behind external Traefik reverse proxy
# Uses PostgreSQL. MariaDB is commented out — uncomment to switch.
# Image: pre-built base image tag (no build step).
# =============================================================================

services:
  moodle:
    # ── Supply your image tag here ──
    image: achelesstech/moodle-nginx-base:php8.4-latest
    container_name: moodle-app
    restart: unless-stopped
    volumes:
      - moodledata:/var/moodledata
    environment:
      - MOODLE_DB_TYPE=pgsql
      - MOODLE_DB_HOST=db
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=moodle
      - MOODLE_URL=https://moodle.example.com
      - MOODLE_SSLPROXY=true
      # ── Redis sessions (uncomment with the redis service below) ──
      # - MOODLE_SESSION_HANDLER=redis
      # - MOODLE_SESSION_REDIS_HOST=redis
      # - MOODLE_SESSION_REDIS_PORT=6379
      # - MOODLE_SESSION_REDIS_PREFIX=mdl_sess_
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    labels:
      - "traefik.enable=true"
      # ── HTTPS router ──
      - "traefik.http.routers.moodle.rule=Host(`moodle.example.com`)"
      - "traefik.http.routers.moodle.entrypoints=websecure"
      - "traefik.http.routers.moodle.tls=true"
      - "traefik.http.routers.moodle.tls.certresolver=cloudflare"
      - "traefik.http.routers.moodle.middlewares=moodle-headers"
      # ── HTTP router → redirect to HTTPS ──
      - "traefik.http.routers.moodle-http.rule=Host(`moodle.example.com`)"
      - "traefik.http.routers.moodle-http.entrypoints=web"
      - "traefik.http.routers.moodle-http.middlewares=moodle-redirect"
      # ── Redirect middleware ──
      - "traefik.http.middlewares.moodle-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.moodle-redirect.redirectscheme.permanent=true"
      # ── HSTS security headers middleware ──
      - "traefik.http.middlewares.moodle-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.moodle-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.moodle-headers.headers.forceSTSHeader=true"
      # ── Service port (base image listens on 8080) ──
      - "traefik.http.services.moodle.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - moodle-internal

  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    container_name: moodle-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=moodle
      - POSTGRES_USER=moodle
      - POSTGRES_PASSWORD=moodle
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - moodle-internal

  # ── Moodle cron sidecar (shares moodledata volume) ──
  moodle-cron:
    image: achelesstech/moodle-nginx-base:php8.4-latest
    container_name: moodle-cron
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        CLI="$${APP_ROOT}/admin/cli"; [ -d "$$CLI" ] || CLI="$${APP_ROOT}/public/admin/cli"
        while true; do php "$$CLI/cron.php" || true; sleep 60; done
    environment:
      - MOODLE_DB_TYPE=pgsql
      - MOODLE_DB_HOST=db
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=moodle
      - MOODLE_URL=https://moodle.example.com
      - MOODLE_SSLPROXY=true
      # - MOODLE_SESSION_HANDLER=redis
      # - MOODLE_SESSION_REDIS_HOST=redis
      # - MOODLE_SESSION_REDIS_PORT=6379
      # - MOODLE_SESSION_REDIS_PREFIX=mdl_sess_
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moodle-internal

  # ── Redis for Moodle sessions (uncomment to enable) ──
  # redis:
  #   image: redis:7-alpine
  #   container_name: moodle-redis
  #   restart: unless-stopped
  #   command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - moodle-internal

  # ── MariaDB (commented out — uncomment and comment PostgreSQL above to switch) ──
  # db:
  #   image: mariadb:11.4
  #   container_name: moodle-db
  #   restart: unless-stopped
  #   command:
  #     - --innodb_file_per_table=1
  #     - --character-set-server=utf8mb4
  #     - --collation-server=utf8mb4_unicode_ci
  #   environment:
  #     - MARIADB_DATABASE=moodle
  #     - MARIADB_USER=moodle
  #     - MARIADB_PASSWORD=moodle
  #     - MARIADB_ROOT_PASSWORD=moodle
  #   volumes:
  #     - mariadb-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - moodle-internal

volumes:
  moodledata:
  pgsql-data:
  # mariadb-data:

networks:
  proxy:
    external: true
  moodle-internal:
    driver: bridge
