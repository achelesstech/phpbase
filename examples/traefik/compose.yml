# =============================================================================
# Traefik v3 — edge router for this host
# =============================================================================
#   make init            create ./certs, ./secrets, the proxy network
#   make htpasswd USER=admin
#   cp .env.example .env  &&  edit
#   make up
#
# Everything else on this host attaches to the external `proxy` network and
# routes itself with labels. See ../../docs/traefik/labels.md.
# =============================================================================

networks:
  # Shared with every application. Created once, outside compose, so no single
  # stack owns it:  docker network create proxy
  proxy:
    external: true

  # Traefik <-> socket-proxy only. `internal: true` means no gateway and no
  # route off the host: if the socket proxy is ever compromised it cannot call
  # out.
  socket:
    name: traefik-socket
    internal: true

services:

  # ---------------------------------------------------------------------------
  # Docker socket proxy — a read-only filter in front of the Docker API
  # ---------------------------------------------------------------------------
  # Traefik needs to list containers and watch events. That is all. Mounting
  # /var/run/docker.sock into Traefik instead grants the full API, which is
  # equivalent to root on the host — `:ro` protects the socket file, not the
  # API behind it. Traefik is the most exposed process here, so it does not get
  # that.
  #
  # Everything is 0 by default in this image; only what Traefik uses is on.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: traefik-socket-proxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # No read_only here, unlike traefik below. This image is haproxy, and its
    # entrypoint renders /usr/local/etc/haproxy/haproxy.cfg from the environment
    # on every start. A read-only root crash-loops on "can't create ...
    # haproxy.cfg", and tmpfs-ing that directory instead masks the
    # haproxy.cfg.template the image ships, which fails the same way one line
    # later. Both were tried. The container holds no secrets and exposes only a
    # GET-filtered API on an internal network.
    environment:
      CONTAINERS: 1     # GET /containers/... — the whole point
      NETWORKS:   1     # resolve which network to reach a container on
      EVENTS:     1     # watch for start/stop, otherwise routing goes stale
      PING:       1
      VERSION:    1
      # Explicitly off — these are the dangerous ones.
      POST:       0     # no create/start/exec/kill. Without this the proxy
                        # is barely better than the raw socket.
      IMAGES:     0
      VOLUMES:    0
      EXEC:       0
      BUILD:      0
      COMMIT:     0
      CONFIGS:    0
      SECRETS:    0
      SERVICES:   0
      SWARM:      0
      SYSTEM:     0
      TASKS:      0
      NODES:      0
      PLUGINS:    0
      INFO:       0
      AUTH:       0
      DISTRIBUTION: 0
      SESSION:    0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Traefik
  # ---------------------------------------------------------------------------
  traefik:
    # Pin the minor. Traefik has broken dynamic-config schemas across minors
    # before; a floating :v3 is an unattended outage.
    # Harder pin:  traefik:v3.6@sha256:...
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped

    depends_on:
      socket-proxy:
        condition: service_started

    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The only capability it needs: binding 80/443 as a non-root-capable
    # process. Not NET_ADMIN, not SYS_ADMIN.
    cap_add: [NET_BIND_SERVICE]

    # The image writes nothing outside the mounts below.
    read_only: true
    tmpfs:
      - /tmp:size=32m

    networks: [proxy, socket]

    ports:
      # mode: host, not the default mode: ingress.
      #
      # The default routes through docker-proxy, which SNATs the connection —
      # every request would arrive from the bridge gateway and X-Forwarded-For
      # would be the only trace of the client. host mode binds the port
      # directly and preserves the source address. With Cloudflare in front you
      # would still get the client IP from XFF, but the trustedIPs check itself
      # depends on the peer address being real.
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host          # HTTP/3 (QUIC)
      # :8082 ping and :9100 metrics are deliberately NOT published. They are
      # reachable from the proxy network (Prometheus) and from the container's
      # own healthcheck, and from nowhere else.

    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - ./secrets:/etc/traefik/secrets:ro
      # Read-write: Traefik owns acme-*.json and rewrites it on every renewal.
      # Back this up. Losing it is not fatal but it re-issues every
      # certificate, and Let's Encrypt rate limits are per-week.
      - ./certs:/etc/traefik/certs

    environment:
      TZ: ${TZ:-Asia/Dhaka}
      # Token auth for the DNS-01 challenge.
      #
      # _FILE, not the value: an env var is visible in `docker inspect`, in
      # `docker compose config`, and in the shell history of anyone who set it.
      # The file variant is read once at start and never appears in metadata.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
      #
      # Do NOT also set CF_API_EMAIL/CF_API_KEY. Those select the legacy Global
      # API Key, which has full account access; the scoped token below can only
      # touch DNS for one zone. Setting both is how a compromised container
      # ends up able to move your domain.

    secrets:
      - cf_dns_api_token

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # ── Dashboard ─────────────────────────────────────────────────────────
      # Behind IP allowlist + basic auth + strict rate limit. Read-only (the
      # API is not exposed for writes), but it enumerates every route,
      # middleware and backend you run — treat it as sensitive.
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN:?set TRAEFIK_DOMAIN in .env}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.dashboard.tls.options=modern@file
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=chain-dashboard@file,noindex@file
      - traefik.http.routers.dashboard.priority=1000

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Traefik holds two file descriptors per connection. The default 1024 is
    # reached at a few hundred concurrent users, and the symptom is
    # "accept: too many open files" in the log with requests simply hanging.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    logging: *logging

secrets:
  cf_dns_api_token:
    file: ./secrets/cf_dns_api_token
