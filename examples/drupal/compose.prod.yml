# =============================================================================
# Production — Drupal 11 behind Traefik (examples/traefik)
# =============================================================================
#   docker compose -f compose.prod.yml up -d --build      (or pull, from CI)
#   docker compose -f compose.prod.yml run --rm migrate   (each deploy)
#
# No `ports:`. Traefik reaches the app on the shared `proxy` network
# (docker network create proxy); TLS, HSTS and redirects are Traefik's job.
# =============================================================================

# The app image: its one name. build-app.yml pushes the same one (APP_IMAGE
# there). Keep the repository PRIVATE: it contains your code. See README.md.
x-image: &image ${APP_IMAGE:-docker.io/achelesstech/drupal-app}:${APP_TAG:-latest}

# What app, scheduler and migrate share.
x-drupal: &drupal
  image: *image
  restart: unless-stopped
  # required: false only so `docker compose config` works without a .env; the
  # ${…:?} checks below still refuse to start without one.
  env_file:
    - path: .env
      required: false
  environment:
    # settings.php builds trusted_host_patterns from this and refuses to start
    # without it; set here too, so compose refuses first.
    APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    # Drush builds absolute links (cron mails, one-time logins) from this.
    DRUSH_OPTIONS_URI: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
  # Hardened run: nothing is writable but /tmp and the two files volumes.
  read_only: true
  # /tmp holds uploads in flight (and ImageMagick's cache): at least
  # 2 x post_max_size + 32 MB. It is RAM, charged to mem_limit, and
  # FPM_MAX_CHILDREN=auto reserves its size; always give it a size=.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  # public:// and private:// are the only state; code and settings.php come
  # from the image.
  volumes:
    - drupal-files:/var/www/html/web/sites/default/files
    - drupal-private:/var/www/html/private
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy

services:
  # Web role: nginx + PHP-FPM (the image's default command).
  app:
    <<: *drupal
    build:
      context: .
      target: production
    # FPM_MAX_CHILDREN=auto: (1024 - 256 OPcache - 64 - 256 tmpfs) / 64 = 7 workers.
    mem_limit: 1g
    # nginx drains for up to 15 s, then PHP-FPM for up to 30 s.
    stop_grace_period: 60s
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${TRAEFIK_ROUTER:?set TRAEFIK_ROUTER in .env}.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=chain-web@file
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=8080

  # Scheduler role: drush cron on every minute boundary. Healthy while runs
  # keep succeeding (the image's heartbeat check). Drupal's own cron jobs
  # throttle themselves; raise "60" if a site's cron is heavy.
  scheduler:
    <<: *drupal
    command: [php-base-every, "60", vendor/bin/drush, cron]
    mem_limit: 512m
    # After app: Docker fills a new volume from the image when the first
    # container mounts it, and containers created at the same moment race
    # ("mkdir …/_data/…: file exists").
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # A run in progress is allowed to finish.
    stop_grace_period: 130s

  # One-shot, never in every replica's entrypoint where schema updates would
  # run concurrently:  docker compose -f compose.prod.yml run --rm migrate
  # Once config/sync is committed, make it [vendor/bin/drush, deploy, -y]
  # (updatedb, config:import, cache:rebuild, deploy hooks).
  migrate:
    <<: *drupal
    command: [vendor/bin/drush, updatedb, -y]
    restart: "no"
    mem_limit: 512m
    profiles: [ops]

  db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-drupal}
      POSTGRES_USER: ${DB_USERNAME:-drupal}
      POSTGRES_PASSWORD: ${DB_PASSWORD?set DB_PASSWORD in .env}
    # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/; mount the parent.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  drupal-files:
  drupal-private:
  db-data:

networks:
  proxy:
    external: true
  internal:
