# hadolint policy — achelesstech images
#
# ignored:
#   DL3018  "pin versions in apk add". Declined deliberately. These images are
#           rebuilt on a schedule precisely so they pick up Alpine patch
#           releases; a pinned version freezes the CVE. Worse, Alpine garbage-
#           collects superseded package versions from its repos within weeks, so
#           a pinned build stops being reproducible AND starts failing outright.
#           Reproducibility here comes from pinning the BASE IMAGE BY DIGEST,
#           which is what examples/*/Dockerfile and Renovate actually do.
#   DL3066  "non-numeric user-id". `USER www-data` is correct here: the base
#           image deletes the stock www-data and recreates it as uid/gid 1000,
#           asserting both at build time, so the name is stable and readable.
#   SC2086  Fires on `apk add $PHPIZE_DEPS`. That variable is a space-separated
#           package list set by the upstream php image and is *required* to
#           word-split; quoting it breaks the build.
ignored:
  - DL3018
  - DL3066
  - SC2086
