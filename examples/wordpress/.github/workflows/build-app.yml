name: build-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The site image: its one name. compose.prod.yml pulls the same one (x-image
  # there); change both together. Spelled out rather than derived from
  # ${{ github.repository }}, so a renamed GitHub repo cannot silently push
  # somewhere else. Keep the repository PRIVATE: the image contains your code.
  # GHCR instead of Docker Hub: ghcr.io/<owner>/<site>, and see README.md.
  APP_IMAGE: docker.io/achelesstech/wordpress-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.APP_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it the way production does: compose.prod.yml, hardening included,
      # with MariaDB and a real install. A build that 500s on / is not a pass.
      - name: Boot and assert
        env:
          APP_TAG: test
        run: |
          set -eu
          domain=ci.example.com
          sed -e "s|^APP_DOMAIN=.*|APP_DOMAIN=${domain}|" \
              -e "s|^WORDPRESS_SECRET=.*|WORDPRESS_SECRET=$(openssl rand -hex 32)|" \
              -e "s|^WORDPRESS_DB_PASSWORD=.*|WORDPRESS_DB_PASSWORD=$(openssl rand -hex 16)|" \
              .env.example > .env
          docker network create proxy
          compose() { docker compose -f compose.prod.yml "$@"; }
          trap 'rc=$?; [ "$rc" -eq 0 ] || compose logs --no-color --tail 50' EXIT

          compose up -d --no-build --wait --wait-timeout 180 app scheduler
          echo "ok: app and scheduler healthy"
          compose exec -T app wp core install --url="https://${domain}" --title=CI \
              --admin_user=ci --admin_password="$(openssl rand -hex 16)" \
              --admin_email=ci@example.com --skip-email

          # As Traefik sends it: the public Host, X-Forwarded-Proto https.
          for path in / /wp-login.php; do
            code="$(compose exec -T app curl -s -o /dev/null -w '%{http_code}' \
                -H "Host: ${domain}" -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8080${path}")"
            if [ "$code" != 200 ]; then
              echo "::error::GET ${path} returned ${code}"
              exit 1
            fi
            echo "ok: GET ${path} -> 200"
          done

      - name: Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.APP_IMAGE }}:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
