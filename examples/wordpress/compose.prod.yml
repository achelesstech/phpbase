# =============================================================================
# Production — WordPress behind Traefik (examples/traefik)
# =============================================================================
#   docker compose -f compose.prod.yml up -d --build      (or pull, from CI)
#   docker compose -f compose.prod.yml exec app wp core install …   (once)
#   docker compose -f compose.prod.yml run --rm migrate   (after a core upgrade)
#
# No `ports:`. Traefik reaches the app on the shared `proxy` network
# (docker network create proxy); TLS, HSTS and redirects are Traefik's job.
# =============================================================================

# The site image: its one name. build-app.yml pushes the same one (APP_IMAGE
# there). Keep the repository PRIVATE: it contains your code. See README.md.
x-image: &image ${APP_IMAGE:-docker.io/achelesstech/wordpress-app}:${APP_TAG:-latest}

# What app, scheduler and migrate share.
x-wordpress: &wordpress
  image: *image
  restart: unless-stopped
  # required: false only so `docker compose config` works without a .env;
  # wp-config.php still refuses to run without the settings it needs.
  env_file:
    - path: .env
      required: false
  # Hardened run: nothing is writable but /tmp and the uploads volume.
  read_only: true
  # /tmp holds uploads in flight and ImageMagick's cache: at least
  # 2 x post_max_size + 32 MB. It is RAM, charged to mem_limit, and
  # FPM_MAX_CHILDREN=auto reserves its size; always give it a size=.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  # Only uploads hold state. Core, themes and plugins come from the image.
  volumes:
    - wp-uploads:/var/www/html/wp-content/uploads
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy

services:
  # Web role: nginx + PHP-FPM (the image's default command).
  app:
    <<: *wordpress
    build:
      context: .
      target: production
    # FPM_MAX_CHILDREN=auto: (1024 - 256 OPcache - 64 - 256 tmpfs) / 64 = 7 workers.
    mem_limit: 1g
    # nginx drains for up to 15 s, then PHP-FPM for up to 30 s.
    stop_grace_period: 60s
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${TRAEFIK_ROUTER:?set TRAEFIK_ROUTER in .env}.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=chain-web@file
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=8080

  # Scheduler role: WordPress's cron on every minute boundary, instead of on
  # page views (DISABLE_WP_CRON). Healthy while runs keep succeeding (the
  # image's heartbeat check).
  scheduler:
    <<: *wordpress
    command: [php-base-every, "60", wp, cron, event, run, --due-now]
    mem_limit: 512m
    # After app: Docker fills a new volume from the image when the first
    # container mounts it, and containers created at the same moment race.
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # A run in progress is allowed to finish.
    stop_grace_period: 130s

  # One-shot, after a WordPress upgrade (WORDPRESS_VERSION in the Dockerfile):
  #   docker compose -f compose.prod.yml run --rm migrate
  migrate:
    <<: *wordpress
    command: [wp, core, update-db]
    restart: "no"
    mem_limit: 512m
    profiles: [ops]

  db:
    image: docker.io/library/mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD?set WORDPRESS_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

volumes:
  wp-uploads:
  db-data:

networks:
  proxy:
    external: true
  internal:
