# =============================================================================
# Production — Moodle 5.3 LTS behind Traefik (examples/traefik)
# =============================================================================
#   docker compose -f compose.prod.yml up -d --build      (or pull, from CI)
#   docker compose -f compose.prod.yml run --rm install   (once, first deploy)
#   docker compose -f compose.prod.yml run --rm migrate   (each new image)
#
# No `ports:`. Traefik reaches the app on the shared `proxy` network
# (docker network create proxy); TLS, HSTS and redirects are Traefik's job.
# =============================================================================

# The app image: its one name. build-app.yml pushes the same one (APP_IMAGE
# there). Keep the repository PRIVATE: it contains your config. See README.md.
x-image: &image ${APP_IMAGE:-docker.io/achelesstech/moodle-app}:${APP_TAG:-latest}

# /tmp of the CLI containers (scheduler, install, migrate): a tmpfs, as they
# take no uploads. app keeps /tmp on a volume instead (below).
x-cli-tmp: &cli-tmp
  - /tmp:rw,noexec,nosuid,nodev,size=256m

# The environment of every Moodle container, spelled out. No `env_file: .env`:
# .env also holds MOODLE_ADMIN_PASSWORD, which only `install` gets (below), so
# it never sits in the environment of app or scheduler (docker inspect,
# /proc/*/environ, getenv() in plugin code, Moodle's PHP info page).
x-moodle-env: &moodle-env
  MOODLE_WWWROOT: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-moodle}
  DB_USERNAME: ${DB_USERNAME:-moodle}
  # Unset fails here; empty passes `config` (.env.example) and config.php
  # throws on every request instead.
  DB_PASSWORD: ${DB_PASSWORD?set DB_PASSWORD in .env}
  # Upload limits (README.md): the largest file a user can upload, course
  # backups included. Moodle's own limits (site, course, activity) sit below.
  # nginx's client_max_body_size follows post_max_size.
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-512M}
  PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-512M}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
  FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-auto}

# What app, scheduler, install and migrate share.
x-moodle: &moodle
  image: *image
  restart: unless-stopped
  environment: *moodle-env
  # Hardened run: nothing is writable but /tmp and moodledata.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  volumes:
    - moodledata:/var/moodledata
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy

services:
  # Web role: nginx + PHP-FPM (the image's default command).
  app:
    <<: *moodle
    build:
      context: .
      target: production
    # /tmp is a named volume, not a tmpfs: a tmpfs sized for 512M uploads
    # (2 x post_max_size + 32 MB = 1056 MB) would be RAM charged to mem_limit.
    # With /tmp on disk, FPM_MAX_CHILDREN=auto reserves nothing for it:
    # (2048 - 256 OPcache - 64) / 64 = 27 workers. Never share this volume:
    # every start wipes /tmp/php-base on it.
    volumes:
      - moodledata:/var/moodledata
      - app-tmp:/tmp
    mem_limit: 2g
    # nginx drains for up to 15 s, then PHP-FPM for up to 30 s.
    stop_grace_period: 60s
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${TRAEFIK_ROUTER:?set TRAEFIK_ROUTER in .env}.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=chain-web@file
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=8080

  # Scheduler role: Moodle's cron on every minute boundary. --keep-alive=0:
  # each run does one pass and exits (Moodle's default keeps it polling for
  # 3 minutes, longer than the interval). Healthy while runs keep succeeding
  # (the image's heartbeat check).
  scheduler:
    <<: *moodle
    command: [php-base-every, "60", php, admin/cli/cron.php, --keep-alive=0]
    tmpfs: *cli-tmp
    mem_limit: 512m
    # After app: Docker fills a new volume from the image when the first
    # container mounts it, and containers created at the same moment race.
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # A run in progress is allowed to finish.
    stop_grace_period: 130s

  # One-shot first install:  docker compose -f compose.prod.yml run --rm install
  install:
    <<: *moodle
    # The admin account, for this one-shot only.
    environment:
      <<: *moodle-env
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Moodle}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-moodle}
    command:
      - sh
      - -c
      - |
        exec php admin/cli/install_database.php --agree-license \
          --adminuser="$${MOODLE_ADMIN_USER}" \
          --adminpass="$${MOODLE_ADMIN_PASSWORD:?set MOODLE_ADMIN_PASSWORD in .env}" \
          --adminemail="$${MOODLE_ADMIN_EMAIL:?set MOODLE_ADMIN_EMAIL in .env}" \
          --fullname="$${MOODLE_SITE_NAME}" \
          --shortname="$${MOODLE_SITE_SHORTNAME}"
    tmpfs: *cli-tmp
    restart: "no"
    mem_limit: 1g
    profiles: [ops]

  # After every new image (upgrade.php):  docker compose -f compose.prod.yml run --rm migrate
  # Maintenance mode stays on if the upgrade fails.
  migrate:
    <<: *moodle
    command:
      - sh
      - -ec
      - |
        php admin/cli/maintenance.php --enable
        php admin/cli/upgrade.php --non-interactive
        php admin/cli/maintenance.php --disable
    tmpfs: *cli-tmp
    restart: "no"
    mem_limit: 1g
    profiles: [ops]

  db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-moodle}
      POSTGRES_USER: ${DB_USERNAME:-moodle}
      POSTGRES_PASSWORD: ${DB_PASSWORD?set DB_PASSWORD in .env}
    # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/; mount the parent.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  moodledata:
  app-tmp:
  db-data:

networks:
  proxy:
    external: true
  internal:
