# hadolint policy — app images on achelesstech/php-base (as in the base repo)
#
# ignored:
#   DL3018  "pin versions in apk add". Declined deliberately, for any package
#           you add (ghostscript here): Alpine garbage-collects superseded
#           package versions within weeks, so a pinned build stops being
#           reproducible AND starts failing outright, and a pinned version
#           freezes the CVE. Reproducibility comes from pinning the BASE IMAGES
#           BY DIGEST, which the Dockerfile does and Renovate maintains.
#   DL3066  "non-numeric user-id". `USER www-data` is correct here: the base
#           image recreates www-data as uid/gid 1000 and asserts both at build
#           time, so the name is stable and readable.
ignored:
  - DL3018
  - DL3066
