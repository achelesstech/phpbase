name: build-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Moodle publishes a weekly build of each stable branch: rebuild to pick it
  # up (and the newest base digest Renovate merged).
  schedule:
    - cron: "0 5 * * 2"

env:
  # The app image: its one name. compose.prod.yml pulls the same one (x-image
  # there); change both together. Spelled out rather than derived from
  # ${{ github.repository }}, so a renamed GitHub repo cannot silently push
  # somewhere else. Keep the repository PRIVATE: the image contains your config.
  # GHCR instead of Docker Hub: ghcr.io/<owner>/<app>, and see README.md.
  APP_IMAGE: docker.io/achelesstech/moodle-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.APP_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it the way production does: compose.prod.yml, hardening included,
      # with PostgreSQL and a real install. A login page that 500s is not a pass.
      - name: Boot and assert
        env:
          APP_TAG: test
        run: |
          set -eu
          sed -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" \
              -e "s|^MOODLE_ADMIN_PASSWORD=.*|MOODLE_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)-1!|" \
              -e "s|^MOODLE_ADMIN_EMAIL=.*|MOODLE_ADMIN_EMAIL=ci@example.com|" \
              .env.example > .env
          domain="$(sed -n 's/^APP_DOMAIN=//p' .env)"
          docker network create proxy
          compose() { docker compose -f compose.prod.yml "$@"; }
          trap 'rc=$?; [ "$rc" -eq 0 ] || compose logs --no-color --tail 50' EXIT

          compose up -d --no-build --wait --wait-timeout 120 db
          compose up -d --no-build --wait --wait-timeout 180 app
          compose run --rm install
          compose up -d --no-build --wait --wait-timeout 180 scheduler
          echo "ok: app and scheduler healthy"

          # The headers Traefik sends: Moodle redirects any other host to wwwroot.
          code="$(compose exec -T app curl -s -o /dev/null -w '%{http_code}' \
              -H "Host: ${domain}" -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Port: 443' \
              http://127.0.0.1:8080/login/index.php)"
          if [ "$code" != 200 ]; then
            echo "::error::GET /login/index.php returned ${code}"
            exit 1
          fi
          echo "ok: GET /login/index.php -> 200"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.APP_IMAGE }}:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
