# =============================================================================
# Moodle vhost — FLAT layout (no public/ directory, no Routing Engine)
# =============================================================================
# Installed automatically by select-vhost.sh when the downloaded tarball has no
# public/index.php. Applies to Moodle 4.x and to any 5.x release that has not
# adopted the public/ restructure.
#
# Differences from vhost-public.conf:
#   * docroot is the install root, so config.php sits INSIDE the served tree
#     (it is executed, never emitted — but see the deny list below)
#   * there is no r.php, so there is no front controller. Moodle URLs map to
#     real .php files; unknown paths are a genuine 404.
#
# Everything else — the pathinfo handling, the location ordering, the ^~ on
# /dataroot/ — is identical and equally load-bearing. See vhost-public.conf for
# why each one matters.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    client_max_body_size 512m;

    # No X-Frame-Options: Moodle needs framing for LTI and several filters.
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health probes ────────────────────────────────────────────────────────
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }

    # ── Internal files that must never be web-served (MDL-69333) ─────────────
    # Longer than the public/ variant: with a flat docroot these paths are all
    # inside the served tree.
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|\.(bak|sql|dist|log)$) {
        deny all;
        return 404;
    }

    # ── PHP — must precede the static-assets regex ───────────────────────────
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        # try_files clears $fastcgi_path_info — save it first.
        set $path_info $fastcgi_path_info;

        # No r.php in this layout: a missing script is a real 404.
        try_files $fastcgi_script_name =404;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        # Re-applied after fastcgi_params, which sets its own PATH_INFO.
        fastcgi_param PATH_INFO       $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        fastcgi_param HTTPS      $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout      600;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff|woff2|ttf|eot|svg|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ── X-Accel-Redirect target for moodledata ───────────────────────────────
    # `^~` is REQUIRED. X-Accel-Redirect re-runs location matching internally,
    # and a plain prefix loses to the static-asset regex above — every
    # xsendfile-served css/png/pdf would then 404 against the docroot.
    location ^~ /dataroot/ {
        internal;
        alias /var/moodledata/;
    }

    # No front controller in this layout.
    location / {
        try_files $uri $uri/ =404;
    }
}
