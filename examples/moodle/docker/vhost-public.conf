# =============================================================================
# Moodle 5.1/5.2+ vhost — docroot is Moodle's public/ directory
# =============================================================================
# Plain HTTP :8080 behind a TLS-terminating proxy (set MOODLE_SSLPROXY=true).
# Requires $CFG->routerconfigured = true; which the entrypoint writes.
#
# Four things here are load-bearing and easy to break:
#
#  1. The PHP location is ordered BEFORE the static-asset regex. Moodle serves
#     real assets through PHP with path info — /lib/requirejs.php/1/all.js,
#     /theme/styles.php/boost/…/all — and the static regex would otherwise
#     match the .js/.css suffix and try_files them off disk.
#
#  2. $fastcgi_path_info is saved into $path_info BEFORE try_files, because
#     try_files clears it, and re-applied AFTER include fastcgi_params, because
#     that file sets PATH_INFO itself.
#
#  3. /dataroot/ uses `^~`, not a plain prefix. X-Accel-Redirect performs an
#     INTERNAL REDIRECT that re-runs location matching; a plain prefix loses to
#     the static-asset regex above, so every xsendfile-served css/png/pdf would
#     404 against the docroot. That failure presents as "theme assets missing".
#
#  4. No X-Frame-Options. Moodle needs framing for LTI and several filters.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # Moodle course backups and large assignment submissions. Keep this >= the
    # app's PHP post_max_size.
    client_max_body_size 512m;

    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health probes ────────────────────────────────────────────────────────
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    # ── Dot-files, keeping RFC 5785 well-known URIs reachable ────────────────
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # ── Internal files that must never be web-served (MDL-69333) ─────────────
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|\.(bak|sql|dist|log)$) {
        deny all;
        return 404;
    }

    # ── PHP — must precede the static-asset regex (see note 1) ───────────────
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        # Save it now: try_files clears $fastcgi_path_info (note 2).
        set $path_info $fastcgi_path_info;

        # Missing scripts fall through to the Routing Engine rather than
        # producing FPM's bare "File not found".
        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php$is_args$args;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        # Re-applied after fastcgi_params, which sets its own PATH_INFO.
        fastcgi_param PATH_INFO       $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        fastcgi_param HTTPS      $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout      600;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Static assets (real files only) ──────────────────────────────────────
    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff|woff2|ttf|eot|svg|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ── X-Accel-Redirect target for moodledata (see note 3) ──────────────────
    # `internal` keeps clients from reaching moodledata directly.
    # The alias MUST keep its trailing slash.
    location ^~ /dataroot/ {
        internal;
        alias /var/moodledata/;
    }

    # ── Front controller — Moodle 5.1+ Routing Engine ────────────────────────
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }
}
