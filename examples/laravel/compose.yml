# =============================================================================
# Local development — Laravel 13
# =============================================================================
#   docker compose up -d
#   docker compose run --rm artisan migrate
#
# Plain HTTP on :8000, source bind-mounted, OPcache revalidating.
# =============================================================================

x-dev-env: &dev-env
  env_file: .env
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    # Local dev is plain HTTP — secure cookies would never be sent back.
    PHP_SESSION_COOKIE_SECURE: "0"
    # Pick up code changes without restarting.
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    PHP_DISPLAY_ERRORS: "On"
    PHP_MEMORY_LIMIT: 512M

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8080"
    <<: *dev-env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm artisan <command>
  artisan:
    build:
      context: .
      target: dev
    entrypoint: ["php", "artisan"]
    <<: *dev-env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    profiles: [tools]

  # docker compose run --rm composer install
  composer:
    build:
      context: .
      target: dev
    entrypoint: ["composer"]
    environment:
      COMPOSER_MEMORY_LIMIT: "-1"
    volumes:
      - ./:/var/www/html
    healthcheck:
      disable: true
    profiles: [tools]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-laravel}
      POSTGRES_USER:     ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
