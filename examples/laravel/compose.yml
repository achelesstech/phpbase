# =============================================================================
# Local development — Laravel 13
# =============================================================================
#   docker compose up -d --build
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate
#
# http://localhost:8080. The source is bind-mounted and OPcache re-checks file
# times, so edits show up without a rebuild. Xdebug is loaded but off:
#   XDEBUG_MODE=debug docker compose up -d
# =============================================================================

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      # Plain HTTP locally: secure cookies would never come back.
      SESSION_SECURE_COOKIE: "false"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Same fallback as the db service below.
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
    # Lets Xdebug reach the IDE on the host (Linux).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
