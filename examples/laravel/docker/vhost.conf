# =============================================================================
# Laravel vhost — served on plain HTTP :8080 behind a TLS-terminating proxy
# =============================================================================
# A static file, deliberately. No placeholders, no runtime rendering — so
# `nginx -t` validates it in CI and you can read it without mentally
# substituting variables during an incident.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    client_max_body_size 100m;

    # Repeated in every location that sets its own add_header — nginx header
    # inheritance is replace-not-merge, so a location with Cache-Control would
    # otherwise silently drop all of these.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health probes ────────────────────────────────────────────────────────
    # /fpm-ping backs the image HEALTHCHECK and must exist. It goes through
    # FastCGI, so it fails when PHP-FPM fails.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff|woff2|ttf|eot|svg|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ── PHP ──────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # `if_not_empty` matters: without it nginx sends HTTPS="" on plain
        # HTTP, so $_SERVER['HTTPS'] is set-but-empty and code that tests
        # isset($_SERVER['HTTPS']) generates https:// URLs over http://.
        fastcgi_param HTTPS     $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";        # httpoxy

        fastcgi_read_timeout      120;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Front controller ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Denies ───────────────────────────────────────────────────────────────
    location ~ /\.well-known/ { allow all; }
    location ~ /\.           { deny all; access_log off; log_not_found off; }

    location ~* \.(env|log|ini|bak|sql|dist|lock|yml|yaml)$ {
        deny all;
        access_log    off;
        log_not_found off;
    }
}
