; =============================================================================
; zz-dev.ini — the :X.Y-dev image only (loads after zz-base.ini)
; =============================================================================
; Never ship this to production: it re-enables assertions, displays errors
; and makes OPcache re-check file mtimes on every request.
; =============================================================================

zend.assertions             = 1
display_errors              = On
display_startup_errors      = On
error_reporting             = E_ALL
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0
; Local dev is plain http://localhost.
session.cookie_secure       = 0

; ── Xdebug: loaded, but OFF until asked ─────────────────────────────────────
; XDEBUG_MODE=debug (or develop,coverage …) in the environment overrides this.
; On Linux add  extra_hosts: ["host.docker.internal:host-gateway"]  to compose.
xdebug.mode                 = off
xdebug.start_with_request   = trigger
xdebug.client_host          = host.docker.internal
xdebug.client_port          = 9003
xdebug.discover_client_host = 0
xdebug.log_level            = 0

; ── PCOV: loaded, disabled; enable for a coverage run ───────────────────────
;   php -d pcov.enabled=1 vendor/bin/pest --coverage
pcov.enabled = 0
