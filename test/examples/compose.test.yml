# =============================================================================
# test/examples/compose.test.yml — layered over an example's compose.prod.yml
# =============================================================================
#   docker compose -p php-base-ex-<fw>-<pid> -f compose.prod.yml \
#       -f <repo>/test/examples/compose.test.yml up -d --build
#
# Two changes, nothing else:
#   - the external `proxy` network becomes a project-local one, so a test never
#     touches the real Traefik network on this machine;
#   - `app` builds from the local base images instead of the digests pinned in
#     the example's Dockerfile. PHP_BASE_IMAGE / PHP_BASE_DEV_IMAGE in the
#     environment pick another local build.
# =============================================================================

networks:
  proxy:
    external: false

services:
  app:
    build:
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-local/php-base:8.4}
        PHP_BASE_DEV_IMAGE: ${PHP_BASE_DEV_IMAGE:-local/php-base:8.4-dev}
