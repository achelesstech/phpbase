name: lint

# =============================================================================
# Every static check, for the base image and the examples: `make lint`, which
# runs scripts/lint.sh (hadolint, shellcheck, actionlint, compose config, the
# Traefik config check, the link check, the unit tests in test/scripts/, and
# the Cloudflare ranges check, which only warns). Same script, same pinned
# linter images as a local `make lint`.
# =============================================================================

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_HUB_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The resolver unit tests read Docker Hub, and anonymous pulls are capped
      # per runner IP. Logged in whenever the secrets exist (not on fork PRs).
      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDENTIALS == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: make lint
        run: make lint
