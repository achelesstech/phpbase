name: watch-upstream

# =============================================================================
# Every 6 hours, cheap (no build): rebuild a published line as soon as any of
# these changes under it (scripts/check-upstream.sh):
#   php-image     php:<line>-fpm-alpine has a new digest
#   alpine-image  alpine:<minor>, the runtime base, has a new digest
#   apk-upgrades  a package in the published image has an upgrade
# and dispatch build-base for just those lines.
#
# Why: PHP shipped the PHP2Shell fixes (CVE-2026-109618/109619, critical,
# FPM affected) on Wednesday 21 Oct 2026. The weekly Monday build alone
# would have published them five days later; this gets them out within six
# hours, without rebuilding everything every time.
# =============================================================================

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to dispatch build-base

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: achelesstech
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compare upstream with what we published
        id: check
        run: scripts/check-upstream.sh >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          REASONS: ${{ steps.check.outputs.reasons }}
        run: |
          {
            echo '| Line | Rebuild reason |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(if .value == "" then "current" else "`\(.value)`" end) |"' <<<"$REASONS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch build-base
        if: steps.check.outputs.rebuild != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ steps.check.outputs.rebuild }}
        run: |
          gh workflow run build-base.yml -R "$GITHUB_REPOSITORY" -f only="$ONLY" -f publish=true -f trigger=watcher
          echo "::notice::dispatched build-base for ${ONLY}"
