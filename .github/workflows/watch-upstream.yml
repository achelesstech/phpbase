name: watch-upstream

# =============================================================================
# OPTIONAL. Daily, cheap (~30 s, no build): if php:<line>-fpm-alpine has a new
# digest since our last publish, start build-base for just those lines.
#
# Why: PHP shipped the PHP2Shell fixes (CVE-2026-109618/109619, critical,
# FPM affected) on Wednesday 21 Oct 2026. The weekly Monday build alone
# would have published them five days later; this gets them out the same or
# next day, without rebuilding everything daily.
# =============================================================================

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to dispatch build-base

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compare upstream digests with what we last built from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$(jq -r .image versions.json)"
          today="$(date -u +%F)"
          stale=()
          while read -r line; do
            upstream="$(docker buildx imagetools inspect "php:${line}-fpm-alpine" --format '{{json .Manifest}}' | jq -r .digest)"
            ours="$(docker buildx imagetools inspect "${image}:${line}" --format '{{json .Image}}' 2>/dev/null \
                    | jq -r '."linux/amd64".config.Labels["org.opencontainers.image.base.digest"] // empty' || true)"
            if [[ "$upstream" != "$ours" ]]; then
              echo "::notice::PHP ${line}: upstream ${upstream:0:19}… differs from ours ${ours:0:19}…"
              stale+=("$line")
            fi
          done < <(jq -r --arg t "$today" '.php[] | select((.prerelease // false) | not) | select(.eol >= $t) | .line' versions.json)
          if [[ ${#stale[@]} -gt 0 ]]; then
            only="$(IFS=,; echo "${stale[*]}")"
            gh workflow run build-base.yml -R "$GITHUB_REPOSITORY" -f only="$only" -f publish=true
            echo "::notice::dispatched build-base for ${only}"
          else
            echo "everything current"
          fi
