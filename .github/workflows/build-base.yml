name: build-base

# =============================================================================
# Weekly (and on-demand) rebuild of docker.io/achelesstech/php-base for every
# supported PHP line, from pinned digests of php:<line>-fpm-alpine and of the
# alpine:<minor> inside it.
#
#   :8.2 :8.3 :8.4 :8.5 (:latest = 8.5)   floating — what apps pin BY DIGEST
#   :8.4.27                                floating within a patch release
#   :8.4.27-20261026 (or .2, .3, …)        one per build (rollback, audit)
#   …-dev / :latest-dev                    the same + Xdebug, PCOV, git
#   :X.Y-rc  :X.Y-rc-dev                   a "prerelease" line's canary (never
#                                          :X.Y); allowed to fail, tagged only
#                                          on a pass. None is listed now.
#
# Flow:  resolve ─► build (line × arch, native runners) ─► publish (per line) ─► guards
#   resolve   pin every upstream input to a digest and pick a build tag
#             no one has published (scripts/resolve-matrix.sh); a line whose
#             upstream is stale fails its freshness guard and is not built
#   build     build + push BY DIGEST (untagged, invisible), pull that exact
#             digest back, report its size, run the behaviour tests, dev
#             tests, framework smoke tests (amd64) and Trivy. Only a digest
#             that passed everything is handed to publish.
#   publish   per line: all platforms passed -> one multi-arch index per
#             variant, tagged and signed. A failure on one line never blocks
#             the others.
#   guards    fails the run, after the healthy lines are published, when a
#             freshness guard removed a line.
#   report    on a scheduled or watcher-dispatched run, any failure opens
#             (or bumps) an issue.
#
# Linting (hadolint, shellcheck, actionlint, the Cloudflare ranges check, …)
# is lint.yml's job: `make lint` on every push and PR.
#
# Required secret: DOCKERHUB_TOKEN, a Read & Write token for the achelesstech
# account. The username is written in, not a secret: GitHub withholds every
# job output that contains a secret's value, and resolve's outputs name
# docker.io/achelesstech/php-base (test/scripts/workflow.test.sh).
# =============================================================================

on:
  schedule:
    # Mondays 03:23 UTC. Off the top of the hour: GitHub delays (and under
    # load drops) scheduled runs that start at :00.
    - cron: '23 3 * * 1'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - rootfs/**
      - rootfs-dev/**
      - versions.json
      - scripts/**
      - test/**
      - .github/workflows/build-base.yml
  pull_request:
    paths:
      - Dockerfile
      - rootfs/**
      - rootfs-dev/**
      - versions.json
      - scripts/**
      - test/**
      - .github/workflows/build-base.yml
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these PHP lines, comma-separated (e.g. 8.4,8.5). Empty = all.'
        required: false
        default: ''
      publish:
        description: 'Push to Docker Hub'
        type: boolean
        default: true
      include_eol:
        description: 'Also build lines past their end-of-life date'
        type: boolean
        default: false
      skip_frameworks:
        description: 'Skip the framework smoke tests (emergency security rebuild)'
        type: boolean
        default: false
      trigger:
        description: 'Who dispatched this run. watch-upstream passes "watcher", so its failures open an issue.'
        required: false
        default: 'manual'

permissions:
  contents: read

concurrency:
  group: build-base-${{ github.ref }}
  # Never cancel a publishing run half-way; do cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/achelesstech/php-base

jobs:
  # ===========================================================================
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_HUB_CREDENTIALS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    outputs:
      lines: ${{ steps.resolve.outputs.lines }}
      build: ${{ steps.resolve.outputs.build }}
      failed: ${{ steps.resolve.outputs.failed }}
      composer: ${{ steps.resolve.outputs.composer }}
      date: ${{ steps.resolve.outputs.date }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Log in whenever the token exists (everything except fork PRs), not
      # only when publishing: anonymous Docker Hub pulls are capped at 100 per
      # hour per IP, runners share IPs, and one weekly run makes dozens of
      # manifest requests. (Verified the hard way while testing this design.)
      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDENTIALS == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: achelesstech
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve upstream digests and versions
        id: resolve
        env:
          ONLY: ${{ inputs.only }}
          INCLUDE_EOL: ${{ inputs.include_eol }}
        run: |
          args=()
          if [[ -n "${ONLY}" ]]; then args+=(--only "${ONLY}"); fi
          if [[ "${INCLUDE_EOL}" == "true" ]]; then args+=(--include-eol); fi
          status=0
          scripts/resolve-matrix.sh "${args[@]}" >resolved.txt 2>resolve.log || status=$?
          cat resolve.log >&2   # the ::warning:: / ::error:: lines become annotations
          cat resolved.txt >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -c .platforms versions.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Resolver warnings"
            echo
            grep -E '^::(warning|error)::' resolve.log | sed -E 's/^::(warning|error)::/- **\1:** /' || echo "None."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Workflow agrees with the resolver
        env:
          BUILD_JSON: ${{ steps.resolve.outputs.build }}
          COMPOSER_IMAGE: ${{ steps.resolve.outputs.composer }}
        run: bash test/scripts/workflow.test.sh

      - name: Publish this run?
        id: publish
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  build:
    name: build ${{ matrix.line }} ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # A PHP release candidate is a canary: its failure is information, not an outage.
    continue-on-error: ${{ matrix.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.build) }}
    env:
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      SCOPE: php${{ matrix.line }}-${{ matrix.arch }}
      HAS_HUB_CREDENTIALS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDENTIALS == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: achelesstech
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same names scripts/build-args.sh gives local builds
      # (test/scripts/workflow.test.sh holds the two lists equal).
      - name: Build arguments
        id: args
        env:
          LINE: ${{ matrix.line }}
          FROM: ${{ matrix.from }}
          ALPINE_REF: ${{ matrix.alpine_image }}
          UPSTREAM: ${{ matrix.upstream }}
          DIGEST: ${{ matrix.digest }}
          PHP_FULL: ${{ matrix.php_version }}
          ALPINE_FULL: ${{ matrix.alpine_full }}
          ALPINE: ${{ matrix.alpine }}
          ALPINE_DIGEST: ${{ matrix.alpine_digest }}
          BUILD_TAG: ${{ matrix.build_tag }}
          PRERELEASE: ${{ matrix.prerelease }}
          COMPOSER: ${{ needs.resolve.outputs.composer }}
          DATE: ${{ needs.resolve.outputs.date }}
        run: |
          {
            echo "list<<EOF"
            echo "PHP_VERSION=${LINE}"
            echo "PHP_IMAGE=${FROM}"
            echo "ALPINE_IMAGE=${ALPINE_REF}"
            echo "COMPOSER_IMAGE=${COMPOSER}"
            echo "UPSTREAM_IMAGE=${UPSTREAM}"
            echo "UPSTREAM_DIGEST=${DIGEST}"
            echo "PHP_FULL_VERSION=${PHP_FULL}"
            echo "ALPINE_FULL_VERSION=${ALPINE_FULL}"
            echo "BASE_NAME=docker.io/library/alpine:${ALPINE}"
            echo "BASE_DIGEST=${ALPINE_DIGEST}"
            echo "BASE_VERSION=${BUILD_TAG}"
            # A per-run value forces a fresh `apk upgrade && apk add` (see
            # Dockerfile), so a same-day watcher rebuild picks up a package fix
            # instead of hitting the gha cache from the day's first build.
            echo "PKG_CACHE_BUST=${DATE}-${GITHUB_RUN_ID}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "VCS_REF=${GITHUB_SHA}"
            echo "ALLOW_MISSING_DEV_EXTENSIONS=$([[ "${PRERELEASE}" == "true" ]] && echo 1 || echo 0)"
            echo "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Publishing run: push BY DIGEST first (no tag points at it yet), then
      #    pull that exact digest back and test it. What is tested is what ships.
      - name: Build and push runtime (by digest)
        id: runtime
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.list }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,scope=${{ env.SCOPE }},mode=max

      - name: Build and push dev (by digest)
        id: dev
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.list }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # Its own scope (read and written), so it never evicts the runtime
          # cache; the runtime scope supplies the layers the two share.
          cache-from: |
            type=gha,scope=${{ env.SCOPE }}-dev
            type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,scope=${{ env.SCOPE }}-dev,mode=max

      - name: Pull the pushed digests for testing
        if: env.PUBLISH == 'true'
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          DEV_DIGEST: ${{ steps.dev.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${RUNTIME_DIGEST}"
          docker pull "${IMAGE}@${DEV_DIGEST}"
          docker tag "${IMAGE}@${RUNTIME_DIGEST}" php-base:test
          docker tag "${IMAGE}@${DEV_DIGEST}" php-base:test-dev

      # ── Pull request: build locally, never push.
      - name: Build runtime (local)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.list }}
          load: true
          tags: php-base:test
          cache-from: type=gha,scope=${{ env.SCOPE }}

      - name: Build dev (local)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.list }}
          load: true
          tags: php-base:test-dev
          cache-from: |
            type=gha,scope=${{ env.SCOPE }}-dev
            type=gha,scope=${{ env.SCOPE }}

      - name: Image sizes
        env:
          LINE: ${{ matrix.line }}
          PLATFORM: ${{ matrix.platform }}
          MAX_MB: ${{ matrix.max_size_mb }}
        run: |
          mb() { docker image inspect -f '{{.Size}}' "$1" | awk '{ printf "%.1f", $1 / 1000000 }'; }
          {
            echo "### PHP ${LINE} ${PLATFORM}: image sizes"
            echo
            echo "| Variant | Uncompressed | Ceiling (\`max_size_mb\`, amd64 runtime) |"
            echo "|---|---|---|"
            echo "| runtime | $(mb php-base:test) MB | ${MAX_MB} MB |"
            echo "| dev | $(mb php-base:test-dev) MB | — |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Behaviour tests (runtime)
        run: test/run.sh php-base:test "${{ matrix.line }}"

      - name: Behaviour tests (dev)
        run: test/run-dev.sh php-base:test-dev

      - name: Framework smoke tests
        # amd64 only: the frameworks are pure PHP, and arm64 already ran the
        # behaviour tests natively above.
        if: matrix.arch == 'amd64' && !inputs.skip_frameworks
        env:
          FRAMEWORKS: ${{ toJSON(matrix.frameworks) }}
        run: test/frameworks/run.sh php-base:test "${FRAMEWORKS}"

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: php-base:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # ── Hand the tested digests to publish ─────────────────────────────────
      - name: Record digests
        if: env.PUBLISH == 'true'
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          DEV_DIGEST: ${{ steps.dev.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          echo "${RUNTIME_DIGEST}" > "digests/runtime-${ARCH}"
          echo "${DEV_DIGEST}" > "digests/dev-${ARCH}"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.line }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  publish:
    name: publish ${{ matrix.line }}
    needs: [resolve, build]
    # always(): one failed line must not stop the others from publishing.
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The pre-release canary is allowed to fail here too without failing the run.
    continue-on-error: ${{ matrix.prerelease }}
    permissions:
      contents: read
      id-token: write   # keyless cosign signature via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.lines) }}
    steps:
      - name: Download tested digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: digests-${{ matrix.line }}-*
          path: digests
          merge-multiple: true

      # A stable line with a missing digest fails this job. The canary is
      # skipped with a warning instead: no tags, and nothing turns red.
      - name: Every platform passed?
        id: ready
        env:
          PLATFORMS: ${{ needs.resolve.outputs.platforms }}
          LINE: ${{ matrix.line }}
          PRERELEASE: ${{ matrix.prerelease }}
        run: |
          for arch in $(jq -r '.[] | split("/")[1]' <<<"${PLATFORMS}"); do
            for variant in runtime dev; do
              if [[ ! -s "digests/${variant}-${arch}" ]]; then
                if [[ "${PRERELEASE}" == "true" ]]; then
                  echo "::warning::PHP ${LINE} (pre-release canary): no tested ${variant} digest for ${arch}. Not published."
                  echo "ready=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::PHP ${LINE}: no tested ${variant} digest for ${arch} — a build or test failed. Not published; the previous tags stay as they were."
                exit 1
              fi
            done
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: achelesstech
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.ready.outputs.ready == 'true'

      # One multi-platform index per variant over the tested per-arch digests
      # (watch-upstream reads the labels of its linux/amd64 entry). What is
      # signed is the digest this create pushed, read from its metadata file,
      # and a failed create fails the job.
      - name: Create multi-arch tags
        id: tag
        if: steps.ready.outputs.ready == 'true'
        env:
          TAGS: ${{ toJSON(matrix.tags) }}
          DEV_TAGS: ${{ toJSON(matrix.dev_tags) }}
        run: |
          publish() {   # publish <variant> <json tag list>  -> prints the index digest
            local variant="$1" tags="$2" meta="imagetools-$1.json" args=() refs=() digest
            while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.[]' <<<"$tags")
            for f in digests/"${variant}"-*; do refs+=("${IMAGE}@$(cat "$f")"); done
            docker buildx imagetools create --metadata-file "$meta" "${args[@]}" "${refs[@]}" >&2 || return 1
            digest="$(jq -r '."containerimage.digest" // ."containerimage.descriptor".digest // empty' "$meta")" || return 1
            if [[ "$digest" != sha256:* ]]; then
              echo "::error::imagetools create (${variant}) reported no digest in ${meta}" >&2
              return 1
            fi
            echo "$digest"
          }
          # Assigned first: inside `echo "x=$(…)"` a failure would be lost.
          runtime="$(publish runtime "${TAGS}")"
          dev="$(publish dev "${DEV_TAGS}")"
          echo "runtime=${runtime}" >> "$GITHUB_OUTPUT"
          echo "dev=${dev}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.ready.outputs.ready == 'true'

      - name: Sign (keyless)
        if: steps.ready.outputs.ready == 'true'
        env:
          RUNTIME: ${{ steps.tag.outputs.runtime }}
          DEV: ${{ steps.tag.outputs.dev }}
        run: cosign sign --yes "${IMAGE}@${RUNTIME}" "${IMAGE}@${DEV}"

      - name: Summary
        if: steps.ready.outputs.ready == 'true'
        env:
          LINE: ${{ matrix.line }}
          PHP_FULL: ${{ matrix.php_version }}
          ALPINE: ${{ matrix.alpine_full }}
          RUNTIME: ${{ steps.tag.outputs.runtime }}
          TAGS: ${{ toJSON(matrix.tags) }}
        run: |
          {
            echo "### PHP ${LINE} — ${PHP_FULL} on Alpine ${ALPINE}"
            echo
            echo "Pin with \`${IMAGE}:${LINE}@${RUNTIME}\`"
            echo
            jq -r '.[] | "- `" + . + "`"' <<<"${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # A line whose upstream failed a freshness guard was never built. Fail the
  # run for it, but only after publish, so the healthy lines still ship.
  guards:
    needs: [resolve, publish]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.failed != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lines a freshness guard removed
        env:
          FAILED: ${{ needs.resolve.outputs.failed }}
        run: |
          jq -r '.[] | "::error::PHP \(.line): \(.reason) — not built."' <<<"${FAILED}"
          {
            echo "### Lines not built"
            echo
            jq -r '.[] | "- PHP \(.line): \(.reason)"' <<<"${FAILED}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ===========================================================================
  # A scheduled run that fails only emails whoever last edited the cron line,
  # and a run the watcher dispatches emails no one. Open (or bump) an issue
  # instead, so a broken weekly or watcher build cannot go unseen.
  report:
    needs: [resolve, build, publish, guards]
    if: >-
      always() && (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.trigger == 'watcher')) && (
        needs.resolve.result == 'failure' || needs.build.result == 'failure' ||
        needs.publish.result == 'failure' || needs.guards.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.resolve.outputs.failed }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'weekly' || inputs.trigger }}
        run: |
          title="php-base build failed (${TRIGGER} run)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          details=""
          if [[ -n "${FAILED}" && "${FAILED}" != "[]" ]]; then
            details=$'\n\nNot built (freshness guard):\n'"$(jq -r '.[] | "- PHP \(.line): \(.reason)"' <<<"${FAILED}")"
          fi
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" --json number -q '.[0].number')"
          if [[ -n "$n" ]]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Failed again: ${url}${details}"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Run: ${url}${details}"
          fi
