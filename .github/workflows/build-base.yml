name: build-base

# Weekly rebuild is the CVE story: it picks up Alpine and PHP patch releases
# without anyone remembering to do it. App repos then get a Renovate PR to bump
# the digest they pin.
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'rootfs/**', '.github/workflows/build-base.yml']
  pull_request:
    paths: ['Dockerfile', 'rootfs/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/php-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.2 is a migration bridge only — security support ends
          # 2026-12-31. Drop it once Laravel 11 is retired.
          - php: '8.2'
            alpine: '3.21'
          - php: '8.4'
            alpine: '3.21'

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load a single-arch image locally so the smoke test can actually run it.
      - name: Build (local, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: php-base:test
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            ALPINE_VERSION=${{ matrix.alpine }}
            BASE_VERSION=${{ matrix.php }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.php }}-buildcache

      - name: Smoke test
        run: make test PHP=${{ matrix.php }} REGISTRY=. IMAGE=php-base VERSION=test
        env:
          DOCKER_BUILDKIT: '1'

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: php-base:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            ALPINE_VERSION=${{ matrix.alpine }}
            BASE_VERSION=${{ matrix.php }}-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.php }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.php }}-${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.php }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.php }}-buildcache,mode=max
