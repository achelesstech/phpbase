# =============================================================================
# Drupal 10/11 vhost — docroot is the composer project's web/ directory
# =============================================================================
# Plain HTTP :8080 behind a TLS-terminating proxy.
#
# The PHP handler uses an EXPLICIT ALLOWLIST of executable entrypoints rather
# than `location ~ \.php$` plus a file-existence guard.
#
# Why: the common recipe
#
#     set $script_path $document_root$fastcgi_script_name;
#     if (!-f $script_path) { return 404; }
#
# does not work. `set` and `if` run in nginx's REWRITE phase, but
# fastcgi_split_path_info runs later, in the CONTENT phase. At rewrite time
# $fastcgi_script_name is still the whole unsplit $uri, so /update.php/selection
# resolves to <docroot>/update.php/selection, !-f is true, and the request 404s
# — the exact case the guard was supposed to fix. The same ordering trap
# applies to `try_files $fastcgi_script_name =404;`.
#
# An allowlist sidesteps the phase problem entirely and is strictly safer: only
# Drupal's real front controllers can ever reach PHP-FPM, so an uploaded .php
# anywhere in the tree is inert.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html/web;
    index index.php;

    client_max_body_size 100m;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health probes ────────────────────────────────────────────────────────
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # ── Denies (before anything that could serve them) ───────────────────────
    location ~ ^/sites/.*/private/                       { return 403; }
    location ~ ^/sites/[^/]+/files/.*\.php$              { deny all; return 404; }
    location ~* ^/(vendor|core/tests)/                   { deny all; return 404; }
    location ~* ^/composer\.(json|lock)$                 { deny all; return 404; }
    location ~* \.(engine|inc|install|make|module|profile|po|sh|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$ {
        deny all;
        return 404;
    }

    location ~ /\.well-known/ { allow all; }
    location ~ (^|/)\.        { deny all; access_log off; log_not_found off; }

    # ── Image styles: let Drupal generate the derivative on first request ────
    # Must precede the static-asset block, or the first hit 404s before the
    # derivative exists.
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    # ── Private files, optionally language-prefixed ──────────────────────────
    location ~ ^(/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff|woff2|ttf|eot|svg|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri @rewrite;
    }

    # ── PHP — allowlisted entrypoints only ───────────────────────────────────
    location ~ ^/(index|update|install|core/install|core/rebuild|core/authorize|core/modules/statistics/statistics)\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        # Evaluated in the CONTENT phase, after split_path_info has run — so
        # unlike the `set`+`if` version above, these are correct.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param QUERY_STRING    $query_string;

        fastcgi_param HTTPS      $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";

        fastcgi_intercept_errors  on;
        fastcgi_read_timeout      300;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Any other .php in the tree is not executable. Belt to the allowlist's braces.
    location ~ \.php($|/) {
        deny all;
        return 404;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }
}
