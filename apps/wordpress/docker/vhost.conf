# =============================================================================
# WordPress vhost — docroot is the install root (no public/ subdirectory)
# =============================================================================
# Plain HTTP :8080 behind a TLS-terminating proxy.
#
# The uploads deny rule below is MANDATORY, not optional hardening. Arbitrary
# file upload into wp-content/uploads followed by direct execution is the most
# exploited path in the entire WordPress ecosystem, and the generic
# front-controller vhost the previous revision used for WordPress had no such
# rule. If you change nothing else here, keep that block.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    client_max_body_size 128m;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health probes ────────────────────────────────────────────────────────
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    # ── MANDATORY: no PHP execution from writable directories ────────────────
    # Must precede every other .php location.
    location ~* ^/wp-content/uploads/.*\.(php|phtml|php[0-9]|phar)$ {
        deny all;
        return 404;
    }
    location ~* ^/wp-content/(uploads|cache|upgrade)/.*\.(php|phtml|php[0-9]|phar)$ {
        deny all;
        return 404;
    }

    # ── Files that must never be served ──────────────────────────────────────
    location = /wp-config.php            { deny all; return 404; }
    location ~* ^/wp-config-sample\.php$ { deny all; return 404; }
    location ~* ^/(readme|license)\.(html|txt)$ { deny all; return 404; }
    location ~* ^/wp-content/debug\.log$ { deny all; return 404; }
    location ~* ^/(vendor|node_modules)/ { deny all; return 404; }

    # xmlrpc.php is a brute-force and pingback-amplification magnet and is
    # unused by most sites. Comment this out only if you actually need the
    # WordPress mobile app or Jetpack's XML-RPC transport.
    location = /xmlrpc.php { deny all; return 404; }

    location ~ /\.well-known/ { allow all; }
    location ~ /\.           { deny all; access_log off; log_not_found off; }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # ── Static assets ────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff|woff2|ttf|eot|svg|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # ── PHP ──────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Without `if_not_empty`, HTTPS is sent as "" on plain HTTP and
        # WordPress's is_ssl() logic sees a set-but-empty value. Combined with
        # WP_HOME/WP_SITEURL on https, that is a redirect loop.
        fastcgi_param HTTPS      $fcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout      300;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Front controller (permalinks) ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}
