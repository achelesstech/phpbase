name: build-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Docker Hub. IMAGE is spelled out rather than derived from ${{ github.repository }}
  # so a renamed GitHub repo cannot silently start pushing to a different Docker
  # Hub repository than compose.prod.yml pulls from.
  REGISTRY: docker.io
  IMAGE: achelesstech/wordpress-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The base image carries the compiled extensions, so this is fast.
      # GitHub Actions cache keeps the app's own composer/npm layers warm without
      # parking a `buildcache` tag in the Docker Hub repository.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it for real. A build that succeeds but 500s on / is not a pass.
      - name: Boot and assert
        run: |
          set -eu
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_DB=app -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U app -d app >/dev/null 2>&1 && break
            sleep 1
          done

          docker run -d --name app --network ci-net \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY="base64:$(head -c32 /dev/urandom | base64)" \
            -e DB_CONNECTION=pgsql -e DB_HOST=db -e DB_DATABASE=app \
            -e DB_USERNAME=app -e DB_PASSWORD=app \
            app:test

          for i in $(seq 1 45); do
            st=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$st" = "healthy" ] && break
            [ "$st" = "unhealthy" ] && break
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' app)" != "healthy" ]; then
            echo "::error::container never became healthy"
            docker logs app
            exit 1
          fi
          echo "ok: healthy (php-fpm reachable)"

          code=$(docker run --rm --network ci-net curlimages/curl:latest \
                   -s -o /dev/null -w '%{http_code}' http://app:8080/)
          case "$code" in
            2*|3*) echo "ok: GET / -> $code" ;;
            *) echo "::error::GET / returned $code"; docker logs app; exit 1 ;;
          esac

      - name: Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
