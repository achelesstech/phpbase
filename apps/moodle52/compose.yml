# =============================================================================
# Local development — Moodle 5.2
# =============================================================================
#   docker compose up -d --build
#   docker compose --profile ops run --rm install
#   → http://localhost:8080
# =============================================================================

x-moodle-env: &moodle-env
  environment:
    MOODLE_DB_TYPE:     mariadb
    MOODLE_DB_HOST:     db
    MOODLE_DB_NAME:     moodle
    MOODLE_DB_USER:     moodle
    MOODLE_DB_PASSWORD: moodle
    MOODLE_URL:         http://localhost:8080
    MOODLE_SSLPROXY:    "false"
    PHP_SESSION_COOKIE_SECURE: "0"
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    PHP_DISPLAY_ERRORS: "On"
    PHP_MEMORY_LIMIT:   512M

services:
  app:
    build:
      context: .
      args:
        MOODLE_BRANCH: "502"
    ports:
      - "8080:8080"
    <<: *moodle-env
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy

  cron:
    build:
      context: .
    command: ["/usr/local/bin/moodle-cron.sh"]
    <<: *moodle-env
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  install:
    build:
      context: .
    <<: *moodle-env
    command:
      - /bin/sh
      - -c
      - |
        CLI="$${APP_ROOT}/public/admin/cli"; [ -d "$$CLI" ] || CLI="$${APP_ROOT}/admin/cli"
        php "$$CLI/install_database.php" --agree-license \
          --adminuser=admin --adminpass=Admin123! \
          --adminemail=admin@example.com \
          --fullname="Moodle Dev" --shortname="dev"
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    profiles: [ops]

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE:             moodle
      MARIADB_USER:                 moodle
      MARIADB_PASSWORD:             moodle
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --innodb_file_per_table=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  moodledata:
  db-data:
