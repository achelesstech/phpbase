# hadolint policy — achelesstech images
#
# ignored:
#   DL3017  "do not use apk upgrade". Required here: docker-library rebuilds
#           the PHP image when PHP or Alpine releases, not when a library such
#           as openssl or libxml2 gets a security fix in between. The weekly
#           `apk upgrade` is how those fixes ship. It stays within the image's
#           Alpine stable branch, which only receives fixes.
#   DL3018  "pin versions in apk add". Declined deliberately. These images are
#           rebuilt on a schedule precisely so they pick up Alpine patch
#           releases; a pinned version freezes the CVE. Alpine also garbage-
#           collects superseded package versions, so a pinned build stops being
#           reproducible AND starts failing outright. Reproducibility comes
#           from pinning the BASE IMAGE BY DIGEST (apps + Renovate).
#   DL3066  "non-numeric user-id". `USER www-data` is correct here: the base
#           image deletes the stock www-data and recreates it as uid/gid 1000,
#           asserting both at build time, so the name is stable and readable.
#   SC2086  Fires on `apk add $PHPIZE_DEPS` / `$runDeps`. Those are space-
#           separated package lists that MUST word-split.
#   DL4006  "set SHELL -o pipefail". Every RUN with a pipe starts with
#           `set -eux -o pipefail` instead (busybox ash supports it). A SHELL
#           instruction would be inherited by every APP image built FROM this
#           base and silently change how their RUN pipelines behave.
#   SC3040  "pipefail is undefined in POSIX sh" — /bin/sh here is busybox ash,
#           which implements it.
ignored:
  - DL3017
  - DL3018
  - DL3066
  - SC2086
  - DL4006
  - SC3040
