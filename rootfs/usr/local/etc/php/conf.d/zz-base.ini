; =============================================================================
; zz-base.ini — achelesstech/php-base production defaults
; =============================================================================
; The official image ships NO php.ini, so PHP's compiled-in defaults apply
; unless set here — including several that php.ini-production would fix
; (zend.assertions=1, request_order="", output_buffering=0, …).
;
; Every value can be overridden at RUNTIME: PHP_* env vars (and PHP_INI_EXTRA)
; are rendered into /tmp/php-base/php/zz-runtime.ini, the last directory in
; PHP_INI_SCAN_DIR, so it always wins. This directory stays root-owned.
; =============================================================================

; ── Limits ───────────────────────────────────────────────────────────────────
; Modest; Moodle and other heavy apps raise them from compose.
memory_limit        = 256M
upload_max_filesize = 64M
post_max_size       = 64M
max_execution_time  = 120
max_input_time      = 120
; Moodle's environment check requires >= 5000 on PHP 8.
max_input_vars      = 5000

; ── Errors ───────────────────────────────────────────────────────────────────
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /proc/self/fd/2
; Stack traces without argument values: no passwords or tokens in the logs.
zend.exception_ignore_args = On

; ── Production engine settings php.ini-production would have set ────────────
; Assertions compiled out. The compiled-in default (1) runs every assert() in
; production — Drupal alone has thousands. Dev image sets 1.
zend.assertions  = -1
; $_REQUEST from GET+POST only. The default ("" -> variables_order EGPCS) lets
; a cookie override a POST field of the same name in $_REQUEST.
request_order    = "GP"
output_buffering = 4096

; ── Time ─────────────────────────────────────────────────────────────────────
date.timezone = UTC

; ── Sessions ─────────────────────────────────────────────────────────────────
; cookie_secure=1 is correct behind a TLS-terminating proxy. For plain-HTTP
; local dev set PHP_SESSION_COOKIE_SECURE=0 (the -dev image does).
; More than one replica needs Redis sessions (PHP_SESSION_SAVE_HANDLER=redis).
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; PHP security advisory 2026-10-23 (CVE-2026-115560): disable upload-progress
; tracking. None of Laravel, Drupal, Moodle or WordPress uses it (Drupal's
; progress bar uses the separate uploadprogress extension).
session.upload_progress.enabled = Off

; ── OPcache ──────────────────────────────────────────────────────────────────
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
; Moodle 5.x plus vendor/ is ~25-30k PHP files; 20000 thrashed the cache.
opcache.max_accelerated_files   = 65407
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0
opcache.save_comments           = 1
; Off: breaks apps that probe for files before the cache is warm.
opcache.enable_file_override    = 0

; JIT is OFF. It gains close to nothing on request-scoped CMS workloads, costs
; jit_buffer_size of RSS, and has a segfault track record under FPM. Enable
; per app (PHP_OPCACHE_JIT=tracing + PHP_OPCACHE_JIT_BUFFER_SIZE=64M) only
; with a benchmark that justifies it.
opcache.jit             = disable
opcache.jit_buffer_size = 0

; ── Realpath cache ───────────────────────────────────────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl  = 600
