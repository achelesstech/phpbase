; =============================================================================
; zz-base.ini — achelesstech/php-base defaults
; =============================================================================
; Baked defaults only. Every value here can be overridden at RUNTIME by an env
; var, which the entrypoint renders into /etc/php-runtime.d/zz-runtime.ini —
; the second entry in PHP_INI_SCAN_DIR, so it always wins. See README.md.
;
; This directory stays root-owned. Do not chown it to www-data.
; =============================================================================

; ── Limits ───────────────────────────────────────────────────────────────────
; Deliberately modest. Moodle and other heavy apps raise these from compose.
memory_limit        = 256M
upload_max_filesize = 64M
post_max_size       = 64M
max_execution_time  = 120
max_input_time      = 120
max_input_vars      = 5000

; ── Errors ───────────────────────────────────────────────────────────────────
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /proc/self/fd/2

; ── Time ─────────────────────────────────────────────────────────────────────
date.timezone = UTC

; ── Sessions ─────────────────────────────────────────────────────────────────
; cookie_secure=1 is correct behind a TLS-terminating proxy: the vhost forwards
; X-Forwarded-Proto as the HTTPS FastCGI param so PHP knows the real scheme.
; For plain-HTTP local dev set PHP_SESSION_COOKIE_SECURE=0.
;
; NOTE: sessions default to local disk. Behind a load balancer with more than
; one replica you need Redis (PHP_SESSION_SAVE_HANDLER / PHP_SESSION_SAVE_PATH)
; or sticky sessions, or logins will break intermittently.
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; ── OPcache ──────────────────────────────────────────────────────────────────
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0
opcache.save_comments           = 1

; Off: breaks apps that probe for files before the cache is warm — Drupal's
; update.php has a long history of failures with it enabled.
opcache.enable_file_override = 0

; JIT is OFF on purpose. Tracing JIT gives close to nothing on request-scoped
; CMS workloads (Moodle, Drupal, WordPress), costs jit_buffer_size of RSS per
; pool, and has a track record of segfaults under FPM. Turn it on per-app only
; with a benchmark that justifies it.
opcache.jit             = disable
opcache.jit_buffer_size = 0

; ── Realpath cache ───────────────────────────────────────────────────────────
; Large frameworks stat thousands of paths per request.
realpath_cache_size = 4096K
realpath_cache_ttl  = 600
