; =============================================================================
; www.conf — achelesstech/php-base pool defaults
; =============================================================================
; Sizing here is a conservative default for a small container. Override at
; RUNTIME with FPM_* env vars — the entrypoint renders them into
; zz-runtime.conf, which loads after this file and wins.
;
;   FPM_PM, FPM_MAX_CHILDREN, FPM_START_SERVERS, FPM_MIN_SPARE_SERVERS,
;   FPM_MAX_SPARE_SERVERS, FPM_MAX_REQUESTS, FPM_PROCESS_IDLE_TIMEOUT,
;   FPM_REQUEST_TERMINATE_TIMEOUT, FPM_SLOWLOG_TIMEOUT
;
; Rough sizing: max_children ~= (container memory - 128M) / average request RSS.
; Measure the average with /fpm-status rather than guessing.
; =============================================================================

[global]
error_log     = /proc/self/fd/2
log_level     = warning
daemonize     = no

; Restart the pool if too many children segfault in a minute rather than
; bleeding workers until the pool is empty.
emergency_restart_threshold  = 10
emergency_restart_interval   = 1m
process_control_timeout      = 10s

[www]
user  = www-data
group = www-data

; TCP rather than a unix socket: nginx and FPM are in the same container and
; the socket adds file-permission failure modes for no measurable gain here.
; listen.owner/group/mode apply to unix sockets only and are intentionally absent.
listen                 = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm                      = dynamic
pm.max_children         = 12
pm.start_servers        = 3
pm.min_spare_servers    = 2
pm.max_spare_servers    = 5
pm.max_requests         = 500
pm.process_idle_timeout = 10s

; Restricted to 127.0.0.1 by the vhost. /fpm-ping backs the image HEALTHCHECK.
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

access.log    = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r\" %s %f %{mili}dms %{kilo}MkB %C%%"

; Surface worker warnings/notices in the container log instead of swallowing them.
catch_workers_output    = yes
decorate_workers_output = no

; Pass the container's environment through to PHP. Required — every app here
; is configured by env vars.
clear_env = no
