; =============================================================================
; www.conf — achelesstech/php-base pool defaults
; =============================================================================
; Conservative sizing for a small container. Override at RUNTIME with FPM_*
; env vars (and FPM_POOL_EXTRA): the entrypoint renders them into
; /tmp/php-base/fpm/zz-runtime.conf, included last, so they win.
;
; Rough sizing: pm.max_children ~= (container memory - 128M) / average worker
; RSS. Measure the average with /fpm-status rather than guessing.
; =============================================================================

[global]
error_log = /proc/self/fd/2
log_level = warning
log_limit = 8192
daemonize = no

; Restart the pool if children segfault in a burst rather than bleeding
; workers until the pool is empty.
emergency_restart_threshold = 10
emergency_restart_interval  = 1m
process_control_timeout     = 10s

[www]
; Ignored (with a NOTICE, below log_level) when the master is not root — the
; normal case. Required when it IS root: a build-time `php-fpm -t` refuses to
; run without them.
user  = www-data
group = www-data

; TCP rather than a unix socket: same container, and a socket only adds
; file-permission failure modes.
listen                 = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm                      = dynamic
pm.max_children         = 12
pm.start_servers        = 3
pm.min_spare_servers    = 2
pm.max_spare_servers    = 5
pm.max_requests         = 500
pm.process_idle_timeout = 10s

; Restricted to loopback by /etc/nginx/php-base/health.conf.
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

; Slow-request traces go to the container log. Without a slowlog path the
; FPM_SLOWLOG_TIMEOUT knob made php-fpm refuse to start ("'slowlog' must be
; specified for use with 'request_slowlog_timeout'").
slowlog                 = /proc/self/fd/2
request_slowlog_timeout = 0

; No FPM access log by default: nginx already logs every request, so it was
; two lines per request. FPM_ACCESS_LOG=1 turns it back on (it adds per-
; request memory and CPU, useful while sizing pm.max_children).

catch_workers_output    = yes
decorate_workers_output = no

; Pass the container environment to PHP: every supported app is configured
; by env vars.
clear_env = no

; Runtime overrides (FPM_* env). Must stay the last line.
include = /tmp/php-base/fpm/*.conf
