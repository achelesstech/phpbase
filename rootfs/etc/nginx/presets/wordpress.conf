# =============================================================================
# preset: wordpress — docroot /var/www/html (WordPress has no public/ dir)
# =============================================================================
#   RUN ln -s /etc/nginx/presets/wordpress.conf /etc/nginx/conf.d/default.conf \
#    && nginx-validate.sh
#
# The uploads rule below is MANDATORY. Uploading a .php into wp-content/uploads
# and requesting it directly is the most exploited path in the WordPress
# ecosystem.
#
# xmlrpc.php is denied (brute-force and pingback-amplification magnet). Sites
# that need Jetpack's XML-RPC transport or the mobile app re-enable it with a
# server.d file:   location = /xmlrpc.php { include /etc/nginx/php-base/fastcgi-php.conf; }
#
# Note: nginx ignores .htaccess. Plugins that "write rules to .htaccess"
# (some caching and security plugins) need their nginx rules in server.d.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    include /etc/nginx/php-base/security-headers.conf;
    include /etc/nginx/php-base/frame-sameorigin.conf;
    include /etc/nginx/php-base/health.conf;
    include /etc/nginx/php-base/deny-dotfiles.conf;
    include /etc/nginx/server.d/*.conf;

    # ── MANDATORY: no PHP execution from writable directories ───────────────
    location ~* ^/wp-content/(?:uploads|cache|upgrade|wflogs)/.*\.(?:php[0-9]?|phtml|phar)$ {
        return 404;
    }

    # ── Files that must never be served ──────────────────────────────────────
    location = /wp-config.php                     { return 404; }
    location ~* ^/wp-config-sample\.php$          { return 404; }
    location ~* ^/(?:readme|license)\.(?:html|txt)$ { return 404; }
    location ~* ^/wp-content/debug\.log$          { return 404; }
    location ~* ^/(?:vendor|node_modules)/        { return 404; }
    location = /xmlrpc.php                        { return 404; }

    location = /favicon.ico { log_not_found off; access_log off; try_files $uri =204; }
    location = /robots.txt  { log_not_found off; access_log off; try_files $uri /index.php?$args; }

    # ── Static assets ────────────────────────────────────────────────────────
    # WordPress versions core/theme/plugin assets with ?ver=, so a week is safe.
    location ~* \.(?:jpe?g|gif|png|webp|avif|heic|css|js|mjs|map|ico|woff2?|ttf|otf|eot|svg|mp4|webm)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files  $uri =404;
    }

    # ── PHP ──────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        include   /etc/nginx/php-base/fastcgi-php.conf;
        fastcgi_read_timeout 300s;
    }

    # ── Front controller (pretty permalinks) ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}
