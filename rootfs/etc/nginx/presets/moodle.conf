# =============================================================================
# preset: moodle — Moodle 5.1+ (public/ docroot + Routing Engine)
# =============================================================================
#   RUN ln -s /etc/nginx/presets/moodle.conf /etc/nginx/conf.d/default.conf \
#    && nginx-validate.sh
#
# For Moodle <= 5.0 (flat layout, no r.php) use moodle-legacy.conf instead.
# config.php needs:  $CFG->routerconfigured = true;
#                    $CFG->sslproxy = true;            (behind Traefik)
#                    $CFG->xsendfile = 'X-Accel-Redirect';
#                    $CFG->xsendfilealiases = ['/dataroot/' => $CFG->dataroot];
# with dataroot at /var/moodledata (the alias below is a fixed path).
#
# Four things here are load-bearing and easy to break:
#  1. The PHP location precedes the static-asset regex. Moodle serves real
#     assets through PHP with path info — /lib/requirejs.php/1/all.js,
#     /theme/styles.php/boost/…/all — and the static regex would otherwise
#     match the .js/.css suffix and try to read them off disk.
#  2. $fastcgi_path_info is saved into $path_info BEFORE try_files (which
#     clears it) and passed AFTER the fastcgi include.
#  3. /dataroot/ is `^~`, not a plain prefix: X-Accel-Redirect re-runs
#     location matching, and a plain prefix loses to the static regex — every
#     xsendfile-served css/png/pdf then 404s ("theme assets missing").
#  4. No X-Frame-Options: LTI and several filters frame Moodle pages.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    include /etc/nginx/php-base/security-headers.conf;
    include /etc/nginx/php-base/health.conf;
    include /etc/nginx/php-base/deny-dotfiles.conf;
    include /etc/nginx/server.d/*.conf;

    # ── Internal files that must never be web-served (MDL-69333) ────────────
    location ~ (?:/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|\.(?:bak|sql|dist|log)$) {
        return 404;
    }

    # ── PHP — must precede the static-asset regex (note 1) ──────────────────
    location ~ \.php(?:/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;     # note 2

        # Missing scripts fall through to the Routing Engine.
        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php$is_args$args;

        include /etc/nginx/php-base/fastcgi-php.conf;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_read_timeout 600s;
    }

    # ── Static assets (real files only) ──────────────────────────────────────
    location ~* \.(?:jpe?g|gif|png|webp|avif|svg|css|js|mjs|map|ico|woff2?|ttf|otf|eot)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files  $uri =404;
    }

    # ── X-Accel-Redirect target for moodledata (note 3) ─────────────────────
    location ^~ /dataroot/ {
        internal;
        alias /var/moodledata/;    # trailing slash required
    }

    # ── Front controller — Routing Engine ────────────────────────────────────
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }
}
