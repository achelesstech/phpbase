# =============================================================================
# preset: laravel — docroot /var/www/html/public
# =============================================================================
#   RUN ln -s /etc/nginx/presets/laravel.conf /etc/nginx/conf.d/default.conf \
#    && nginx-validate.sh
#
# Folds in what FarmBook and HQ each had to fix by hand:
#   * Only public/index.php executes. Any other .php under public/ — an upload
#     that landed there, a forgotten phpinfo.php — is a 404, never code.
#   * A missing static file falls through to Laravel instead of nginx's 404:
#     Livewire serves /livewire/livewire.js from a route, and image routes
#     (Glide, signed storage URLs) end in .png/.jpg.
#   * Only Vite's content-hashed /build/ output is cached as immutable. Other
#     static files get a short max-age so a changed favicon or logo appears.
#   * /.well-known/ reaches Laravel (anchored; see deny-dotfiles.conf).
#
# Extend without forking: drop extra `location` blocks into
# /etc/nginx/server.d/*.conf at build time (root-owned). They are included
# before the catch-all blocks below, so they win.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root    /var/www/html/public;
    index   index.php;
    charset utf-8;

    include /etc/nginx/php-base/security-headers.conf;
    include /etc/nginx/php-base/frame-sameorigin.conf;
    include /etc/nginx/php-base/health.conf;
    include /etc/nginx/php-base/deny-dotfiles.conf;
    include /etc/nginx/server.d/*.conf;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =204; }

    # Vite output: file names carry a content hash, so they never change.
    location ^~ /build/ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    # Everything else that looks static: short cache, and fall through to the
    # front controller when the file does not exist on disk.
    location ~* \.(?:css|js|mjs|map|json|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf|txt|xml)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files  $uri /index.php?$query_string;
    }

    # The front controller — the only PHP entrypoint.
    location = /index.php {
        include /etc/nginx/php-base/fastcgi-php.conf;
    }

    location ~ \.php(?:$|/) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
