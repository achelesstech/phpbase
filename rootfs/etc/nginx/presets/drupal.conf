# =============================================================================
# preset: drupal — Drupal 10/11/12, docroot /var/www/html/web
# =============================================================================
#   RUN ln -s /etc/nginx/presets/drupal.conf /etc/nginx/conf.d/default.conf \
#    && nginx-validate.sh
#
# PHP runs through an explicit ALLOWLIST of Drupal's real front controllers,
# not `location ~ \.php$` plus a file-existence guard. The common
#
#     set $script $document_root$fastcgi_script_name; if (!-f $script) …
#
# recipe evaluates in nginx's REWRITE phase, before fastcgi_split_path_info
# has run, so /update.php/selection resolves to a non-existent file and 404s.
# The allowlist sidesteps that and makes an uploaded .php anywhere inert.
#
# Extend without forking: /etc/nginx/server.d/*.conf (included first).
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html/web;
    index index.php;

    include /etc/nginx/php-base/security-headers.conf;
    include /etc/nginx/php-base/frame-sameorigin.conf;
    include /etc/nginx/php-base/health.conf;
    include /etc/nginx/php-base/deny-dotfiles.conf;
    include /etc/nginx/server.d/*.conf;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # ── Denies (before anything that could serve them) ─────────────────────
    location ~ ^/sites/.*/private/          { return 403; }
    location ~ ^/sites/[^/]+/files/.*\.php$ { return 404; }
    location ~* ^/(?:vendor|core/tests)/    { return 404; }
    location ~* ^/composer\.(?:json|lock)$  { return 404; }
    location ~* \.(?:engine|inc|install|make|module|profile|po|sh|theme|twig|tpl(?:\.php)?|xtmpl|yml)(?:~|\.sw[op]|\.bak|\.orig|\.save)?$ {
        return 404;
    }

    # ── Image styles: Drupal generates the derivative on the first request ──
    # Must precede the static-asset block, or that first hit 404s.
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    # ── Private files, optionally language-prefixed ─────────────────────────
    location ~ ^(?:/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Aggregated CSS/JS (/sites/*/files/css|js) are content-addressed; theme
    # and module assets are not, so the long cache is limited to files/.
    location ~* ^/sites/[^/]+/files/.+\.(?:css|js)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri @rewrite;
    }
    location ~* \.(?:jpe?g|gif|png|webp|avif|css|js|mjs|map|ico|woff2?|ttf|otf|eot|svg)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files  $uri @rewrite;
    }

    # ── PHP — allowlisted entrypoints only ───────────────────────────────────
    location ~ ^/(?:index|update|install|core/install|core/rebuild|core/authorize|core/modules/statistics/statistics)\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include /etc/nginx/php-base/fastcgi-php.conf;
        # Evaluated in the CONTENT phase, after split_path_info has run.
        fastcgi_param PATH_INFO    $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
    }

    # Any other .php in the tree is not executable.
    location ~ \.php(?:$|/) {
        return 404;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }
}
