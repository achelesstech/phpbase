# =============================================================================
# preset: moodle-legacy — Moodle <= 5.0 (flat layout, no Routing Engine)
# =============================================================================
#   RUN ln -s /etc/nginx/presets/moodle-legacy.conf /etc/nginx/conf.d/default.conf \
#    && nginx-validate.sh
#
# Same load-bearing rules as moodle.conf (read its header). Differences: the
# docroot is the install root, so config.php sits inside the served tree (it
# is executed, never emitted), and an unknown path is a real 404.
# =============================================================================

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    include /etc/nginx/php-base/security-headers.conf;
    include /etc/nginx/php-base/health.conf;
    include /etc/nginx/php-base/deny-dotfiles.conf;
    include /etc/nginx/server.d/*.conf;

    location ~ (?:/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|\.(?:bak|sql|dist|log)$) {
        return 404;
    }

    location ~ \.php(?:/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;

        include /etc/nginx/php-base/fastcgi-php.conf;
        fastcgi_param PATH_INFO $path_info;
    }

    location ~* \.(?:jpe?g|gif|png|webp|avif|svg|css|js|mjs|map|ico|woff2?|ttf|otf|eot)$ {
        include    /etc/nginx/php-base/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files  $uri =404;
    }

    location ^~ /dataroot/ {
        internal;
        alias /var/moodledata/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
