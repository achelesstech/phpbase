# =============================================================================
# status-server.conf — FPM liveness and status pages on 127.0.0.1:8081
# =============================================================================
# Included by nginx.conf at http{} level, so every app has it and no vhost has
# to define anything for the image HEALTHCHECK.
#
# Loopback only, by the listen address. An ACL on the public port is not
# enough: real_ip trusts the private ranges, so any container on the same
# Docker network could send X-Forwarded-For: 127.0.0.1 and pass
# `allow 127.0.0.1`. Nothing outside the container reaches this listener.
#
# /fpm-ping goes THROUGH FastCGI: it fails when PHP-FPM is dead, unlike a
# static `return 200` that nginx answers alone. healthcheck.sh calls it.
# =============================================================================

server {
    listen      127.0.0.1:8081;
    server_name _;
    access_log  off;

    location = /fpm-ping {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  php_fpm;
    }

    location = /fpm-status {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  php_fpm;
    }

    location = /nginx-status {
        stub_status;
    }

    location / {
        return 404;
    }
}
