# =============================================================================
# security-headers.conf — headers safe for every framework
# =============================================================================
# Include at server{} level AND inside any location that sets its own
# add_header (nginx replaces inherited add_header lists, it never merges).
#
# Not here, on purpose:
#   X-Frame-Options  -> frame-sameorigin.conf; Moodle must NOT send it (LTI and
#                       several filters frame Moodle pages).
#   HSTS, CSP        -> Traefik middleware / the application. HSTS on plain
#                       HTTP :8080 means nothing, and CSP is app-specific.
# =============================================================================

add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
