# =============================================================================
# fastcgi-php.conf — the PHP handler body (include inside a PHP location)
# =============================================================================
# Shared by every preset so a fix here reaches every app on the next base
# digest bump. Does NOT set fastcgi_read_timeout (presets differ: Moodle needs
# far longer than Laravel) — set it next to the include.
#
# $realpath_root rather than $document_root: with a symlinked release
# directory, OPcache keys on the resolved path, so a deploy that flips the
# symlink is picked up instead of serving the previous release from cache.
# =============================================================================

include       fastcgi_params;
fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT   $realpath_root;

# TLS is terminated upstream; see the $fcgi_https map in nginx.conf.
fastcgi_param HTTPS           $fcgi_https if_not_empty;

# httpoxy: never let a client-supplied Proxy: header become $_SERVER['HTTP_PROXY'].
fastcgi_param HTTP_PROXY      "";

fastcgi_pass              php_fpm;
fastcgi_buffer_size       128k;
fastcgi_buffers           4 256k;
fastcgi_busy_buffers_size 256k;
