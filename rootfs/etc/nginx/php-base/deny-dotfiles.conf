# =============================================================================
# deny-dotfiles.conf — never serve .env, .git/, .htaccess, …
# =============================================================================
# One anchored regex instead of the common pair
#
#     location ~ /\.well-known/ { allow all; }   # unanchored: matches anywhere
#     location ~ /\.            { deny all; }
#
# The negative lookahead keeps RFC 8615 /.well-known/ reachable (ACME, security.txt,
# change-password) and denies every other dot-path segment, at any depth.
# =============================================================================

location ~ /\.(?!well-known/) {
    deny          all;
    access_log    off;
    log_not_found off;
    return 404;
}
