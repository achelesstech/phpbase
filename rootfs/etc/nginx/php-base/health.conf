# =============================================================================
# health.conf — FPM liveness and status endpoints (include inside server{})
# =============================================================================
# The image HEALTHCHECK calls /fpm-ping, which goes THROUGH FastCGI: it fails
# when PHP-FPM is dead, unlike a static `return 200` that nginx answers alone.
# Every preset includes this file, so the contract cannot be forgotten.
#
# Loopback only. Loopback is deliberately not a trusted real-IP source, so a
# forged X-Forwarded-For cannot rewrite $remote_addr past these ACLs.
# =============================================================================

location = /fpm-ping {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass  php_fpm;
}

location = /fpm-status {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass  php_fpm;
}

location = /nginx-status {
    access_log  off;
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    stub_status;
}
