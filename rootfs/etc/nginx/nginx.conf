# =============================================================================
# nginx.conf — achelesstech/php-base
# =============================================================================
# http{} BLOCK ONLY. There is no server{} block here.
#
# The application image supplies exactly one static vhost at
# /etc/nginx/conf.d/vhost.conf. That file is owned by the app repo, lives next
# to the code it serves, and can be validated with `nginx -t` in that repo's CI.
#
# Runs entirely as www-data. No `user` directive (a non-root master cannot
# setuid), and no worker_rlimit_nofile (a non-root process cannot raise the
# hard limit, so setting it only produces a startup warning).
# =============================================================================

worker_processes auto;

# stdout/stderr so `docker logs` and your log driver see everything. Writing to
# /var/log/nginx/*.log instead hides all traffic from the platform and grows the
# container's writable layer without rotation.
error_log /dev/stderr warn;

# NOT in /tmp. /tmp is world-writable with the sticky bit, so a root-owned
# nginx.pid left there by a build-time `nginx -t` can never be overwritten by
# the www-data runtime user — nginx then fails to start in every container.
# /var/tmp/run is created and chowned to www-data at build time.
pid /var/tmp/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Non-root temp paths ──
    # /var/tmp/nginx is chowned to www-data at build time. /tmp is avoided
    # because it is world-writable.
    client_body_temp_path /var/tmp/nginx/client-body;
    proxy_temp_path       /var/tmp/nginx/proxy;
    fastcgi_temp_path     /var/tmp/nginx/fastcgi;
    uwsgi_temp_path       /var/tmp/nginx/uwsgi;
    scgi_temp_path        /var/tmp/nginx/scgi;

    # ── Real client IP ──────────────────────────────────────────────────────
    # Without this, REMOTE_ADDR is Traefik's container IP for every request.
    # That silently breaks anything keyed on the client address:
    #   * Moodle  — login throttling, IP blocking, logs showing one IP for all
    #   * Drupal  — flood control on login/password reset
    #   * Laravel — RateLimiter / throttle middleware
    #   * every access log line
    #
    # Trusting RFC1918 + ULA is correct here and needs no per-deployment
    # configuration: the only thing that can reach this container is Traefik,
    # on a Docker network, which is always private. Cloudflare never talks to
    # nginx directly — it talks to Traefik.
    #
    # SECURITY: this makes nginx trust X-Forwarded-For from anything on the
    # private network, so TRAEFIK must be the one that overwrites XFF from
    # untrusted sources. See docs/reverse-proxy.md — if Traefik does not
    # restrict its own trusted IPs to Cloudflare's ranges, a client can forge
    # X-Forwarded-For and defeat every rate limit above.
    # Loopback is deliberately NOT trusted. Nothing legitimate sends
    # X-Forwarded-For over 127.0.0.1, and leaving it untrusted is what keeps
    # the `allow 127.0.0.1` ACL on /fpm-ping and /fpm-status meaningful — trust
    # it and a forged header could rewrite $remote_addr past those rules.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Reverse-proxy scheme awareness ──
    # Traefik terminates TLS; this maps the forwarded scheme into a value the
    # vhost passes to PHP as the HTTPS FastCGI param.
    #
    # Vhosts MUST use `fastcgi_param HTTPS $fcgi_https if_not_empty;`.
    # Without `if_not_empty`, nginx sends HTTPS="" on plain HTTP, so
    # $_SERVER['HTTPS'] is *set but empty* and any code testing
    # isset($_SERVER['HTTPS']) concludes TLS is on and emits https:// URLs.
    map $http_x_forwarded_proto $fcgi_https {
        default "";
        https   "on";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /dev/stdout main;

    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Generous default; each vhost narrows or widens it for its own app. Keep
    # this >= the app's PHP post_max_size or uploads fail at the nginx layer.
    client_max_body_size        100m;
    client_body_buffer_size     16k;
    large_client_header_buffers 4 16k;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # NOTE: security headers are deliberately NOT set here.
    # nginx `add_header` inheritance is REPLACE, not merge: any location that
    # sets its own add_header silently drops every header inherited from http{}.
    # Static-asset blocks always set Cache-Control, so http-level headers would
    # vanish exactly where you stop noticing. Set them per-vhost (see the app
    # templates) or, better, once on Traefik as middleware.

    include /etc/nginx/conf.d/*.conf;
}
