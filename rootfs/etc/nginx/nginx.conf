# =============================================================================
# nginx.conf — achelesstech/php-base
# =============================================================================
# http{} BLOCK ONLY. The application supplies the server{} block, either its
# own file in /etc/nginx/conf.d/ or one of the framework presets:
#
#     RUN ln -s /etc/nginx/presets/laravel.conf /etc/nginx/conf.d/default.conf \
#      && nginx-validate.sh
#
# Runs entirely as www-data. No `user` directive (a non-root master cannot
# setuid), and no worker_rlimit_nofile (a non-root process cannot raise the
# hard limit, so setting it only produces a startup warning).
#
# Everything a deployment needs to vary — the worker count, trusted proxy
# ranges, the request body limit, the access log, dynamic gzip, the FastCGI
# read timeout — is rendered from env at container start into
# /tmp/php-base/nginx/main.d/ and http.d/ (see docker-entrypoint.sh). This
# file and everything else under /etc/nginx stay root-owned and read-only at
# runtime.
# =============================================================================

# ── Rendered at container start from env ────────────────────────────────────
#   10-php-base.conf   worker_processes (NGINX_WORKER_PROCESSES, default 2)
# A glob, so build-time `nginx -t` passes before anything is rendered.
include /tmp/php-base/nginx/main.d/*.conf;

# stdout/stderr so `docker logs` and the log driver see everything.
error_log /dev/stderr warn;

# Under /tmp/php-base: created by the entrypoint, wiped at every start.
pid /tmp/php-base/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Non-root temp paths ─────────────────────────────────────────────────
    # Created by the entrypoint at every start. With `read_only: true` these
    # live on the /tmp tmpfs, so request bodies still have somewhere to buffer.
    client_body_temp_path /tmp/php-base/nginx/tmp/client-body;
    proxy_temp_path       /tmp/php-base/nginx/tmp/proxy;
    fastcgi_temp_path     /tmp/php-base/nginx/tmp/fastcgi;
    uwsgi_temp_path       /tmp/php-base/nginx/tmp/uwsgi;
    scgi_temp_path        /tmp/php-base/nginx/tmp/scgi;

    # ── PHP-FPM ─────────────────────────────────────────────────────────────
    # A Unix socket in the runtime dir (www.conf); every snippet passes to it
    # by this name with `fastcgi_pass php_fpm;`.
    upstream php_fpm {
        server unix:/tmp/php-base/php-fpm.sock;
    }

    # ── Reverse-proxy scheme awareness ──────────────────────────────────────
    # Traefik terminates TLS; this maps the forwarded scheme into the HTTPS
    # FastCGI param (see /etc/nginx/php-base/fastcgi-php.conf).
    #
    # Always pass it with `if_not_empty`. Without it nginx sends HTTPS="" on
    # plain HTTP, so $_SERVER['HTTPS'] is *set but empty* and code testing
    # isset($_SERVER['HTTPS']) concludes TLS is on.
    map $http_x_forwarded_proto $fcgi_https {
        default "";
        https   "on";
    }

    # SERVER_PORT is the port the client used (443 behind Traefik), not 8080,
    # so URLs an app builds from it are right. Only a plain number is trusted.
    map $http_x_forwarded_port $fcgi_server_port {
        default      $server_port;
        "~^[0-9]+$"  $http_x_forwarded_port;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
                    '"method":"$request_method","uri":"$request_uri","status":$status,'
                    '"bytes":$body_bytes_sent,"referer":"$http_referer",'
                    '"user_agent":"$http_user_agent","xff":"$http_x_forwarded_for",'
                    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;

    # Longer than Traefik's 90 s idle timeout for backend connections, so
    # nginx never closes a connection Traefik is about to reuse (a 502).
    keepalive_timeout 120s;
    keepalive_requests 10000;

    client_body_buffer_size     16k;
    large_client_header_buffers 4 16k;

    # ── Compression ─────────────────────────────────────────────────────────
    # Traefik compresses responses, so dynamic gzip is off here (compressing
    # twice wastes CPU); NGINX_GZIP=1 renders it into http.d for deployments
    # without such a proxy. A pre-compressed foo.css.gz is still served for
    # foo.css: that costs nothing. gzip_static reads the next two as well:
    # Vary keeps a shared cache (a CDN) from handing the .gz to a client that
    # did not ask for it, and `any` serves it to requests that carry Via.
    # Neither turns compression on by itself.
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;

    # ── Static file metadata cache ──────────────────────────────────────────
    # Lookup errors are not cached, so a file uploaded a moment ago is found.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # NOTE: security headers are deliberately NOT set here. nginx `add_header`
    # inheritance is REPLACE, not merge: a location with its own add_header
    # drops every header inherited from http{}. The presets include
    # /etc/nginx/php-base/security-headers.conf explicitly wherever they set
    # other headers. Or set them once on Traefik as middleware.

    # ── Rendered at container start from env ────────────────────────────────
    #   10-php-base.conf   client_max_body_size, real-IP trust, access_log,
    #                      fastcgi_read_timeout, gzip (NGINX_GZIP=1)
    # A glob, so build-time `nginx -t` passes before anything is rendered.
    include /tmp/php-base/nginx/http.d/*.conf;

    include /etc/nginx/conf.d/*.conf;
}
