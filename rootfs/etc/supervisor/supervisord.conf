# =============================================================================
# supervisord.conf — achelesstech/php-base
# =============================================================================
# Runs as www-data. No per-program `user=` — a non-root supervisord cannot
# setuid, and programs would fail to spawn.
#
# There is deliberately NO [unix_http_server] / [supervisorctl] section. The
# control socket would be owned by www-data, which is also the uid PHP-FPM
# workers run as, so an RCE in the application would gain a process-spawning
# and persistence channel. Nothing in this image needs supervisorctl.
# =============================================================================

[supervisord]
nodaemon         = true
logfile          = /dev/null
logfile_maxbytes = 0
pidfile          = /var/tmp/run/supervisord.pid
loglevel         = info

[include]
files = /etc/supervisor/conf.d/*.conf

# ── PHP-FPM ──────────────────────────────────────────────────────────────────
# stopsignal QUIT is FPM's graceful shutdown: finish in-flight requests, then
# exit. The default TERM kills workers mid-request.
[program:php-fpm]
command                 = php-fpm --nodaemonize --force-stderr
autostart               = true
autorestart             = true
startretries            = 3
startsecs               = 3
priority                = 5
stopsignal              = QUIT
stopwaitsecs            = 30
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

# ── Nginx ────────────────────────────────────────────────────────────────────
# Higher priority => stopped FIRST on shutdown, so nginx stops accepting new
# requests before FPM begins draining.
[program:nginx]
command                 = nginx -g "daemon off;"
autostart               = true
autorestart             = true
startretries            = 3
startsecs               = 3
priority                = 10
stopsignal              = QUIT
stopwaitsecs            = 15
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

# ── Fail-fast listener ───────────────────────────────────────────────────────
# Without this, a program that exhausts startretries sits in FATAL forever
# while supervisord stays alive — container "up", every request 502.
[eventlistener:fatal-exit]
command                 = /usr/local/bin/supervisor-fatal-listener.sh
events                  = PROCESS_STATE_FATAL
autostart               = true
autorestart             = true
priority                = 1
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0
