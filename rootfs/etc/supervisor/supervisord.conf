; =============================================================================
; supervisord.conf — achelesstech/php-base
; =============================================================================
; Runs as www-data. No per-program `user=` (a non-root supervisord cannot
; setuid), and NO [unix_http_server]/[supervisorctl]: the control socket would
; be owned by the same uid as the PHP workers, giving an RCE a process-spawning
; persistence channel.
;
; Optional in-container programs, switched on by env (no runtime-writable
; config needed, unlike writing a conf.d file from an entrypoint hook):
;
;   SCHEDULER_COMMAND   e.g. "php artisan schedule:run"   (every SCHEDULER_INTERVAL s, default 60)
;                            "vendor/bin/drush cron"
;                            "wp cron event run --due-now"
;                            "php public/admin/cli/cron.php"
;   WORKER_COMMAND      e.g. "php artisan queue:work --max-time=3600"
;
; For anything bigger than a single small site run these as separate
; containers instead (same image, `command:` override) — see README.
; =============================================================================

[supervisord]
nodaemon         = true
logfile          = /dev/null
logfile_maxbytes = 0
pidfile          = /tmp/php-base/supervisord.pid
loglevel         = info

[include]
files = /etc/supervisor/conf.d/*.conf

; ── PHP-FPM ──────────────────────────────────────────────────────────────────
; QUIT is FPM's graceful stop: finish in-flight requests, then exit.
[program:php-fpm]
command                 = php-fpm --nodaemonize --force-stderr
autostart               = true
autorestart             = true
startretries            = 3
startsecs               = 3
priority                = 5
stopsignal              = QUIT
stopwaitsecs            = 30
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

; ── nginx ────────────────────────────────────────────────────────────────────
; Higher priority => stopped FIRST, so nginx stops accepting requests before
; FPM drains. `-e stderr` keeps nginx from opening its compiled-in error log
; before the config is read.
[program:nginx]
command                 = nginx -e stderr -g "daemon off;"
autostart               = true
autorestart             = true
startretries            = 3
startsecs               = 3
priority                = 10
stopsignal              = QUIT
stopwaitsecs            = 15
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

; ── Optional: periodic scheduler (SCHEDULER_COMMAND) ─────────────────────────
[program:scheduler]
command                 = /usr/local/bin/php-base-every --name scheduler %(ENV_SCHEDULER_INTERVAL)s -- %(ENV_SCHEDULER_COMMAND)s
directory               = %(ENV_APP_ROOT)s
autostart               = %(ENV_PHP_BASE_SCHEDULER_ENABLED)s
autorestart             = true
startsecs               = 2
priority                = 20
stopsignal              = TERM
stopwaitsecs            = 120
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

; ── Optional: long-running worker (WORKER_COMMAND) ───────────────────────────
[program:worker]
command                 = %(ENV_WORKER_COMMAND)s
directory               = %(ENV_APP_ROOT)s
autostart               = %(ENV_PHP_BASE_WORKER_ENABLED)s
autorestart             = true
startsecs               = 2
priority                = 20
stopsignal              = TERM
stopwaitsecs            = 120
stdout_logfile          = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0

; ── Fail-fast listener ───────────────────────────────────────────────────────
; A program that exhausts startretries sits in FATAL forever while supervisord
; stays up — container "running", every request 502. This stops the container
; instead, so `restart: unless-stopped` / the orchestrator can act.
[eventlistener:fatal-exit]
command                 = /usr/local/bin/supervisor-fatal-listener.sh
events                  = PROCESS_STATE_FATAL
autostart               = true
autorestart             = true
priority                = 1
stderr_logfile          = /dev/fd/2
stderr_logfile_maxbytes = 0
