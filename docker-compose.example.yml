# =============================================================================
# Development example — Laravel (local, no Traefik: port published directly)
# =============================================================================
# * Secrets come from .env (the old file committed a real APP_KEY).
# * PHP_SESSION_COOKIE_SECURE=0 because local dev is plain HTTP.
# * OPcache timestamp validation ON so code changes are picked up.
# =============================================================================

x-app-env: &app-env
  env_file: .env
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8888
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    PHP_SESSION_COOKIE_SECURE: "0"

services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile.laravel
      args:
        BASE_IMAGE: achelesstech/laravel-nginx-base:php8.4-latest
    ports:
      - "8888:8080"
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-network

  # Helpers: docker compose --profile tools run --rm composer install
  composer:
    image: achelesstech/laravel-nginx-base:php8.4-latest
    working_dir: /var/www/html
    entrypoint: ["composer"]
    command: ["install"]
    environment:
      COMPOSER_MEMORY_LIMIT: -1
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-network
    profiles:
      - tools

  artisan:
    image: achelesstech/laravel-nginx-base:php8.4-latest
    working_dir: /var/www/html
    entrypoint: ["php", "artisan"]
    <<: *app-env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laravel-network
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laravel-network

volumes:
  postgres-data:

networks:
  laravel-network:
    driver: bridge
